name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # autodoc imports the pybosl2 modules, which import the pythonscad C extension;
      # it dlopens these system libraries at import time.  The same libraries are
      # needed by the PythonSCAD AppImage for headless STL rendering.
      - name: Install system libraries for the pythonscad wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libglib2.0-0 \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libxkbcommon0 libx11-6 libxext6 libxrender1

      - name: Install pythonscad Python package and its Python deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy shapely
          pip install pythonscad

      - name: Install PythonSCAD binary
        run: |
          gh release download --repo pythonscad/pythonscad \
            --pattern '*qt6*x86_64.AppImage' \
            --dir /tmp
          APPIMAGE=$(ls /tmp/*qt6*x86_64.AppImage | head -1)
          chmod +x "$APPIMAGE"
          cd /opt
          "$APPIMAGE" --appimage-extract
          # AppRun inside squashfs-root needs to find its bundled libraries;
          # keep the whole tree intact under /opt/pythonscad.
          sudo mv /tmp/squashfs-root /opt/pythonscad 2>/dev/null || \
            sudo mv squashfs-root /opt/pythonscad 2>/dev/null || \
            (sudo mkdir -p /opt/pythonscad && sudo cp -a squashfs-root/* /opt/pythonscad/ 2>/dev/null || true)
          # AppRun may be at /opt/pythonscad/squashfs-root/AppRun or /opt/pythonscad/AppRun
          BIN=$(find /opt/pythonscad -name AppRun -type f | head -1)
          [ -n "$BIN" ] || BIN="$APPIMAGE"
          sudo chmod +x "$BIN"
          echo "PYTHONSCAD_BIN=$BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install numpy/shapely for PythonSCAD's bundled Python
        run: |
          PYBASE=$(find /opt/pythonscad -name 'pythonscad' -type f -path '*/usr/bin/*' | head -1)
          if [ -z "$PYBASE" ]; then
            PYBASE=$(find /opt/pythonscad -path '*/bin/python3' -type f | head -1)
          fi
          echo "AppImage Python: $PYBASE"
          "$PYBASE" --version
          "$PYBASE" -m pip install --user numpy shapely

      - name: Verify PythonSCAD renders (with library path setup)
        run: |
          BIN=$(find /opt/pythonscad -name AppRun -type f | head -1)
          REPO_ROOT=$(pwd)
          cat > /tmp/test_render.py << PYEOF
          import sys, site, os
          sys.path.insert(0, "$REPO_ROOT")
          for p in site.getsitepackages():
              if p not in sys.path:
                  sys.path.insert(0, p)
          usp = site.getusersitepackages()
          if os.path.isdir(usp) and usp not in sys.path:
              sys.path.insert(0, usp)
          host_sp = os.path.join("$pythonLocation", "lib", "python3.12", "site-packages")
          if os.path.isdir(host_sp) and host_sp not in sys.path:
              sys.path.insert(0, host_sp)
          import numpy as np
          import shapely
          print(f"numpy {np.__version__}  shapely {shapely.__version__}", file=sys.stderr, flush=True)
          from pythonscad import cube
          cube([1,1,1]).show()
          PYEOF
          "$BIN" --trust-python --enable python-engine -o /tmp/test.stl --backend Manifold /tmp/test_render.py
          ls -la /tmp/test.stl

      - name: Install package and remaining docs dependencies
        run: |
          pip install -e '.[docs]'

      - name: Build HTML
        run: |
          set -o pipefail
          make -C docs html 2>&1 | tee sphinx.log

      - name: Verify no render failures
        run: |
          if grep -q 'render FAILED' sphinx.log; then
            echo "ERROR: Render failures detected:"
            grep 'render FAILED' sphinx.log
            exit 1
          fi
          echo "All renders passed."

      - name: Verify output is not empty
        run: |
          PAGE_COUNT=$(find wiki -name '*.html' | wc -l)
          echo "Generated ${PAGE_COUNT} HTML pages"
          if [ "$PAGE_COUNT" -lt 10 ]; then
            echo "ERROR: Too few pages (${PAGE_COUNT}). Check sphinx.log for import failures."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
