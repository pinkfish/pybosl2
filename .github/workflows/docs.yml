name: docs

# Build dev docs from main branch and push to gh-pages under /dev/.
# The root of gh-pages holds the latest release (built by release-docs.yml),
# and /vX.Y.Z/ directories hold older releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for the pythonscad wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libglib2.0-0 \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libxkbcommon0 libx11-6 libxext6 libxrender1

      - name: Install pythonscad Python package and its Python deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy shapely
          pip install pythonscad

      - name: Install PythonSCAD binary
        run: |
          gh release download --repo pythonscad/pythonscad \
            --pattern '*qt6*x86_64.AppImage' \
            --dir /tmp
          APPIMAGE=$(ls /tmp/*qt6*x86_64.AppImage | head -1)
          chmod +x "$APPIMAGE"
          cd /opt
          "$APPIMAGE" --appimage-extract
          sudo mv /tmp/squashfs-root /opt/pythonscad 2>/dev/null || \
            sudo mv squashfs-root /opt/pythonscad 2>/dev/null || \
            (sudo mkdir -p /opt/pythonscad && sudo cp -a squashfs-root/* /opt/pythonscad/ 2>/dev/null || true)
          BIN=$(find /opt/pythonscad -name AppRun -type f | head -1)
          [ -n "$BIN" ] || BIN="$APPIMAGE"
          sudo chmod +x "$BIN"
          echo "PYTHONSCAD_BIN=$BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          "$BIN" --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install package and remaining docs dependencies
        run: |
          pip install -e '.[docs]'

      - name: Build HTML
        run: |
          set -o pipefail
          make -C docs html 2>&1 | tee sphinx.log

      - name: Move dev docs into dev subdirectory
        run: |
          mkdir -p _site/dev
          rm -rf _site/dev/*
          rsync -a wiki/ _site/dev/

      - name: Checkout existing gh-pages and keep old content
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" _ghpages 2>/dev/null && \
            rsync -a --exclude dev _ghpages/ _site/ && rm -rf _ghpages || true

      - name: Verify output is not empty
        run: |
          PAGE_COUNT=$(find _site -name '*.html' | wc -l)
          echo "Generated ${PAGE_COUNT} HTML pages"
          if [ "$PAGE_COUNT" -lt 10 ]; then
            echo "ERROR: Too few pages (${PAGE_COUNT}). Check sphinx.log for import failures."
            exit 1
          fi

      - name: Deploy dev docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: false
