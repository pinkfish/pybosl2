name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build sphinx docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # autodoc imports the pybosl2 modules, which import the pythonscad C extension;
      # it dlopens these system libraries at import time.  The same libraries are
      # needed by the PythonSCAD AppImage for headless STL rendering.
      - name: Install system libraries for the pythonscad wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libglib2.0-0 \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libxkbcommon0 libx11-6 libxext6 libxrender1

      - name: Install pythonscad Python package
        run: |
          python -m pip install --upgrade pip
          pip install pythonscad

      - name: Install PythonSCAD binary
        run: |
          gh release download --repo pythonscad/pythonscad \
            --pattern '*qt6*x86_64.AppImage' \
            --dir /tmp
          APPIMAGE=$(ls /tmp/*qt6*x86_64.AppImage | head -1)
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract
          sudo mkdir -p /opt/pythonscad/bin
          sudo cp squashfs-root/AppRun /opt/pythonscad/bin/pythonscad
          echo "/opt/pythonscad/bin" >> "$GITHUB_PATH"
          chmod +x /opt/pythonscad/bin/pythonscad
          /opt/pythonscad/bin/pythonscad --version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify PythonSCAD renders
        run: |
          echo "from pythonscad import cube; cube([1,1,1]).show()" > /tmp/test_render.py
          /opt/pythonscad/bin/pythonscad --trust-python --enable python-engine -o /tmp/test.stl --backend Manifold /tmp/test_render.py
          ls -la /tmp/test.stl

      - name: Install package and remaining docs dependencies
        run: |
          pip install -e '.[docs]'

      - name: Build HTML
        run: |
          set -o pipefail
          make -C docs html 2>&1 | tee sphinx.log

      - name: Verify no render failures
        run: |
          if grep -q 'render FAILED' sphinx.log; then
            echo "ERROR: Render failures detected:"
            grep 'render FAILED' sphinx.log
            exit 1
          fi
          echo "All renders passed."

      - name: Verify output is not empty
        run: |
          PAGE_COUNT=$(find wiki -name '*.html' | wc -l)
          echo "Generated ${PAGE_COUNT} HTML pages"
          if [ "$PAGE_COUNT" -lt 10 ]; then
            echo "ERROR: Too few pages (${PAGE_COUNT}). Check sphinx.log for import failures."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
