name: Format Python Code

# Same double-run as tests.yml had: `push` on every branch plus `pull_request` ran this twice
# for any commit with an open PR.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Pinned with the rest -- see ci.yml. This job *commits* what it reformats, so an
      # unpinned formatter can rewrite the repository on an upstream release.
      - name: Install Ruff
        run: pip install "ruff==0.17.6"

      - name: Format with Ruff
        run: ruff format .

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format Python code"
