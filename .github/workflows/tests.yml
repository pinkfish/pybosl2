name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: mypy (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy numpy typing-extensions

      - name: Run mypy
        run: mypy --strict pybosl2 tests

  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `.[test]` carries mypy, which tests/test_docstring_examples.py needs to run the Q-6
      # gate over every docstring example. Without it that test would skip, and a skipped gate
      # reports the same green tick as a passing one.
      - name: Install package with test and docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,docs]'

      - name: Verify the docstring-example gate can run
        run: python -m mypy --version

      - name: Build spec sheets (required by test_docs_links)
        run: |
          cd docs
          mkdir -p _extra/specs
          python3 _specgen.py
          cd ..

      - name: Run tests (excluding render tests)
        run: pytest -q --deselect tests/test_stl_render.py --deselect tests/test_stl_render_2d.py

  artifact:
    # SPEC Q-7: every other gate reads the working copy. This one asks what a release actually
    # contains -- build the wheel, install it into a virtualenv that has nothing else in it, and
    # type-check a consumer snippet against the installed package rather than against the source.
    # It is how `py.typed` came to be absent from every published wheel while `mypy --strict` ran
    # clean on every commit.
    name: artifact (wheel install + consumer type-check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist_ci

      - name: The wheel carries its type declarations
        run: |
          python - <<'EOF'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist_ci").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          missing = [n for n in ["pybosl2/py.typed"] if n not in names]
          stubs = sorted(p.as_posix() for p in pathlib.Path("pybosl2").rglob("*.pyi"))
          missing += [s for s in stubs if s not in names]
          if missing:
              raise SystemExit(f"{wheel.name} is missing: {missing}")
          print(f"{wheel.name}: py.typed and {len(stubs)} stubs present")
          EOF

      - name: Install it into a clean virtualenv
        run: |
          python -m venv /tmp/consumer
          /tmp/consumer/bin/pip install --upgrade pip
          /tmp/consumer/bin/pip install dist_ci/*.whl mypy

      - name: It imports with nothing else installed
        run: /tmp/consumer/bin/python -c "import pybosl2; print('import ok', pybosl2.__version__)"

      - name: A consumer snippet type-checks against the installed package
        run: |
          mkdir -p /tmp/consumer-src
          cat > /tmp/consumer-src/use_pybosl2.py <<'EOF'
          """What a caller writes on day one, checked as they would receive it."""

          from pybosl2 import Anchor, Path2D, cuboid

          part = cuboid([60, 40, 12], rounding=4, edges=Anchor.Z)
          width: float = part.bounds().size[0]

          outline = Path2D([[0, 0], [80, 0], [80, 60]], closed=True)
          perimeter: float = outline.perimeter()

          print(width, perimeter)
          EOF
          cd /tmp/consumer-src && /tmp/consumer/bin/mypy --strict use_pybosl2.py

  test-render:
    name: render (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for the pythonscad wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libglib2.0-0 \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libxkbcommon0 libx11-6 libxext6 libxrender1

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Verify the docstring-example gate can run
        run: python -m mypy --version

      - name: Verify pythonscad imports
        run: python -c "import pythonscad, openscad, pybosl2.shapes3d; print('native modules import OK')"

      - name: Run render tests (includes pythonscad-dependent 2D/3D tests)
        run: |
          pytest -q \
            tests/test_stl_render.py \
            tests/test_stl_render_2d.py \
            tests/test_shapes2d_object.py \
            tests/test_sdf_shapes2d.py \
            tests/test_backend_crossbackend.py \
            tests/test_backend_sdf.py \
            tests/test_native_ops.py
