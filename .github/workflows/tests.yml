name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: mypy (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy numpy typing-extensions

      - name: Run mypy
        run: mypy pybosl2 tests

  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with test and docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,docs]'

      - name: Build spec sheets (required by test_docs_links)
        run: |
          cd docs
          mkdir -p _extra/specs
          python3 _specgen.py
          cd ..

      - name: Run tests (excluding render tests)
        run: pytest -q --deselect tests/test_stl_render.py --deselect tests/test_stl_render_2d.py

  test-render:
    name: render (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for the pythonscad wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libglib2.0-0 \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libxkbcommon0 libx11-6 libxext6 libxrender1

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Verify pythonscad imports
        run: python -c "import pythonscad, openscad, pybosl2.shapes3d; print('native modules import OK')"

      - name: Run render tests
        run: pytest -q tests/test_stl_render.py tests/test_stl_render_2d.py \
          -k "not (test_stroke_arrow_endcap_2d or test_stroke_diamond_endcap_straddles_end or test_stroke_tail_and_arrow_mixed or test_stroke_arrow_endcap_3d_is_a_cone)"
