name: tests

# `pull_request` covers every branch that has one, and `push` covers `main`. Firing on both
# `push: ['**']` and `pull_request` ran every job in this file **twice** for any commit with an
# open PR: the two events land in different concurrency groups (`tests-refs/heads/<branch>` and
# `tests-<pr number>`), so neither cancelled the other, and the suite ran 6 times per PR before
# `CI`'s own copy made 7. A branch pushed without an open PR now runs nothing here, which is the
# deliberate trade: open the PR and it is covered.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: mypy (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `.[test]` rather than `mypy numpy typing-extensions`: without the package installed,
      # `pythonscad` is absent and **every native symbol resolves to `Any`**, so these legs
      # reported green while tests/test_backend_type_parity.py found 29 errors in the same
      # commit (T124). The point of three legs is that each Python resolves its own dependency
      # versions -- collapsing them into one runner with `--python-version` flags is not the
      # same check and produces false positives: measured, 8 bogus `ndarray.max()` overload
      # errors on the 3.11 target, because the numpy stubs belong to the running interpreter.
      - name: Install package and mypy
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Run mypy
        run: mypy --strict pybosl2 tests

  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Full history: diff-cover compares against `origin/<base ref>` on the coverage leg below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `.[test]` carries mypy, which tests/test_docstring_examples.py needs to run the Q-6
      # gate over every docstring example. Without it that test would skip, and a skipped gate
      # reports the same green tick as a passing one.
      - name: Install package with test and docs extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test,docs]' diff-cover

      - name: Verify the docstring-example gate can run
        run: python -m mypy --version

      - name: The generated documents are current
        run: python docs/_reqgen.py --check

      - name: Build spec sheets (required by test_docs_links)
        run: |
          cd docs
          mkdir -p _extra/specs
          python3 _specgen.py
          cd ..

      # `-n auto`: 11m50 serial against 7m38 on four cores for the same 8371 tests. Serial is
      # only ~69% CPU-bound, so the gain is 1.57x rather than the core count.
      - name: Run tests (excluding render tests)
        if: matrix.python-version != '3.12'
        run: pytest -q -n auto --deselect tests/test_stl_render.py --deselect tests/test_stl_render_2d.py

      # The coverage gates used to be a whole separate job in ci.yml -- `test-and-coverage` --
      # which ran this same suite, on this same Python, excluding these same render tests, for a
      # seventh copy of an eight-minute run. Measuring one matrix leg costs that leg a little
      # and nothing else. Only the render tests are held back: they drive the PythonSCAD app
      # binary, which this runner does not install (the `test-render` job covers them).
      # Coverage rides this leg instead of ci.yml running the whole suite a seventh time.
      # It must be `pytest --cov`, not `coverage run -m pytest`: under `-n auto` the latter
      # traces only the parent and reports 0% of 21282 statements.
      - name: Run tests with coverage (excluding render tests)
        if: matrix.python-version == '3.12'
        run: >
          pytest -q -n auto
          --deselect tests/test_stl_render.py
          --deselect tests/test_stl_render_2d.py
          --cov=pybosl2 --cov-report=xml
          ${{ github.event_name == 'push' && '--cov-fail-under=79' || '' }}

      - name: Check diff coverage (>=90% on new/modified code)
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        run: |
          diff-cover coverage.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=90 \
            --html-report=diff-coverage.html

      - name: Upload coverage HTML (PR only)
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: diff-coverage-report
          path: diff-coverage.html

  artifact:
    # SPEC Q-7: every other gate reads the working copy. This one asks what a release actually
    # contains -- build the wheel, install it into a virtualenv that has nothing else in it, and
    # type-check a consumer snippet against the installed package rather than against the source.
    # It is how `py.typed` came to be absent from every published wheel while `mypy --strict` ran
    # clean on every commit.
    name: artifact (wheel install + consumer type-check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist_ci

      - name: The wheel carries its type declarations
        run: |
          python - <<'EOF'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist_ci").glob("*.whl"))
          names = set(zipfile.ZipFile(wheel).namelist())
          missing = [n for n in ["pybosl2/py.typed"] if n not in names]
          stubs = sorted(p.as_posix() for p in pathlib.Path("pybosl2").rglob("*.pyi"))
          missing += [s for s in stubs if s not in names]
          if missing:
              raise SystemExit(f"{wheel.name} is missing: {missing}")
          print(f"{wheel.name}: py.typed and {len(stubs)} stubs present")
          EOF

      - name: Install it into a clean virtualenv
        run: |
          python -m venv /tmp/consumer
          /tmp/consumer/bin/pip install --upgrade pip
          /tmp/consumer/bin/pip install dist_ci/*.whl mypy

      - name: It imports with nothing else installed
        run: /tmp/consumer/bin/python -c "import pybosl2; print('import ok', pybosl2.__version__)"

      - name: A consumer snippet type-checks against the installed package
        run: |
          mkdir -p /tmp/consumer-src
          cat > /tmp/consumer-src/use_pybosl2.py <<'EOF'
          """What a caller writes on day one, checked as they would receive it."""

          from pybosl2 import Anchor, Path2D, cuboid

          part = cuboid([60, 40, 12], rounding=4, edges=Anchor.Z)
          width: float = part.bounds().size[0]

          outline = Path2D([[0, 0], [80, 0], [80, 60]], closed=True)
          perimeter: float = outline.perimeter()

          print(width, perimeter)
          EOF
          cd /tmp/consumer-src && /tmp/consumer/bin/mypy --strict use_pybosl2.py

  test-render:
    name: render (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system libraries for the pythonscad wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libglib2.0-0 \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libxkbcommon0 libx11-6 libxext6 libxrender1

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Verify the docstring-example gate can run
        run: python -m mypy --version

      - name: Verify pythonscad imports
        run: python -c "import pythonscad, openscad, pybosl2.shapes3d; print('native modules import OK')"

      - name: Run render tests (includes pythonscad-dependent 2D/3D tests)
        run: |
          pytest -q \
            tests/test_stl_render.py \
            tests/test_stl_render_2d.py \
            tests/test_shapes2d_object.py \
            tests/test_sdf_shapes2d.py \
            tests/test_backend_crossbackend.py \
            tests/test_backend_sdf.py \
            tests/test_native_ops.py
