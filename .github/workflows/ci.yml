name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff is pinned to the version .pre-commit-config.yaml declares, and
      # tests/test_ci_gates.py fails if the two drift apart. Unpinned, this job installed
      # whatever ruff had released that morning: a rule that grew to cover a new case turned a
      # green branch red with no commit behind it (SIM102 reaching `elif` bodies did exactly
      # that), and `ruff check .` passing locally stopped meaning anything.
      - name: Install dependencies
        run: pip install -e ".[test]" "ruff==0.17.6" mypy
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy --strict -p pybosl2

# `test-and-coverage` lived here and ran the whole suite a seventh time per PR to measure
# coverage. The measurement now rides on tests.yml's 3.12 matrix leg, which was already running
# that same suite on that same Python. What stays here is the lint gate and the **only** mypy
# run that type-checks against the real native stubs: tests.yml's `mypy (...)` legs install
# `mypy numpy typing-extensions` without the package, so every native symbol is `Any` there.
