name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Without this, a second push while the first is still running costs a full duplicate of this
# workflow -- only tests.yml was cancelling superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint only. `mypy` used to run here as well, and it was for a long time the **only** mypy run
  # that saw the real native stubs -- tests.yml's legs installed no package, so every native
  # symbol was `Any`. Those legs install `.[test]` now and cover 3.11/3.12/3.13, which makes this
  # copy redundant, and dropping it takes `.[test]` (numpy, shapely, the ~24MB pythonscad wheel)
  # off this job's install entirely.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # ruff is pinned to the version .pre-commit-config.yaml declares, and
      # tests/test_ci_gates.py fails if the two drift apart. Unpinned, this job installed
      # whatever ruff had released that morning: a rule that grew to cover a new case turned a
      # green branch red with no commit behind it (SIM102 reaching `elif` bodies did exactly
      # that), and `ruff check .` passing locally stopped meaning anything.
      - name: Install ruff
        run: pip install "ruff==0.17.6"
      - name: ruff check
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
