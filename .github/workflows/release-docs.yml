name: release-docs

# Build a versioned snapshot of the docs whenever a release is published and
# push it to the gh-pages branch root (latest release) and /v<version>/ (archive).
# The dev docs (built by docs.yml) live under /dev/, so all three are served side
# by side: root = latest release, /dev/ = main-branch docs, /vX.Y.Z/ = old releases.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build release docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system libraries for the pythonscad wheel
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglu1-mesa libegl1 libglib2.0-0 \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libxkbcommon0 libx11-6 libxext6 libxrender1

      - name: Install pythonscad Python package and its Python deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy shapely
          pip install pythonscad

      - name: Install PythonSCAD binary
        run: |
          gh release download --repo pythonscad/pythonscad \
            --pattern '*qt6*x86_64.AppImage' \
            --dir /tmp
          APPIMAGE=$(ls /tmp/*qt6*x86_64.AppImage | head -1)
          chmod +x "$APPIMAGE"
          cd /opt
          "$APPIMAGE" --appimage-extract
          sudo mv /tmp/squashfs-root /opt/pythonscad 2>/dev/null || \
            sudo mv squashfs-root /opt/pythonscad 2>/dev/null || \
            (sudo mkdir -p /opt/pythonscad && sudo cp -a squashfs-root/* /opt/pythonscad/ 2>/dev/null || true)
          BIN=$(find /opt/pythonscad -name AppRun -type f | head -1)
          [ -n "$BIN" ] || BIN="$APPIMAGE"
          sudo chmod +x "$BIN"
          echo "PYTHONSCAD_BIN=$BIN" >> "$GITHUB_ENV"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install package and remaining docs dependencies
        run: |
          pip install -e '.[docs]'

      - name: Resolve version directory
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VDIR="v${VERSION}"
          echo "version_dir=${VDIR}" >> "$GITHUB_OUTPUT"
          echo "Resolved version directory: ${VDIR}"

      - name: Build HTML
        run: |
          set -o pipefail
          make -C docs html 2>&1 | tee sphinx.log

      - name: Checkout existing gh-pages as base
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" _ghpages 2>/dev/null && \
            mkdir -p _site && rsync -a --exclude dev _ghpages/ _site/ && rm -rf _ghpages || true

      - name: Move built docs into versioned subdirectory and root
        run: |
          VDIR="${{ steps.version.outputs.version_dir }}"

          # Clean existing version directory and root (preserve v*/ and dev/ subdirs).
          mkdir -p "_site/${VDIR}"
          rm -rf "_site/${VDIR}"/*
          find _site -maxdepth 1 ! -name '_site' ! -name 'v*' ! -name 'dev' ! -name '_stl' ! -name 'versions.json' ! -name '.nojekyll' ! -name 'CNAME' \
            -exec rm -rf {} + 2>/dev/null || true

          cp -a wiki/* "_site/${VDIR}/"
          rsync -a wiki/ _site/

      - name: Prune old versions and write versions.json
        run: |
          VDIR="${{ steps.version.outputs.version_dir }}"
          shopt -s nullglob
          VDIRS=( _site/v*/ )
          shopt -u nullglob
          VNAMES=()
          for d in "${VDIRS[@]}"; do
            VNAMES+=( "$(basename "$d")" )
          done
          if [ ${#VNAMES[@]} -gt 5 ]; then
            SORTED=( $(printf '%s\n' "${VNAMES[@]}" | sort -rV) )
            for i in $(seq 5 $(( ${#SORTED[@]} - 1 )) ); do
              echo "Pruning old version: ${SORTED[$i]}"
              rm -rf "_site/${SORTED[$i]}"
            done
          fi
          # Generate versions.json — a sorted list of all deployed version dirs.
          shopt -s nullglob
          VDIRS=( _site/v*/ )
          shopt -u nullglob
          VNAMES=()
          for d in "${VDIRS[@]}"; do
            VNAMES+=( "$(basename "$d")" )
          done
          if [ ${#VNAMES[@]} -gt 0 ]; then
            printf '%s\n' "${VNAMES[@]}" | sort -rV > _site/versions_list.txt
            python3 -c "import json; lines=[l.strip() for l in open('_site/versions_list.txt') if l.strip()]; json.dump(lines, open('_site/versions.json','w')); print(f'versions.json written with {len(lines)} entries: {lines}')"
            rm -f _site/versions_list.txt
          else
            echo "ERROR: No v* version directories found in _site/. The Sphinx build may have failed."
            exit 1
          fi

      - name: Verify output is not empty
        run: |
          PAGE_COUNT=$(find _site -name '*.html' | wc -l)
          echo "Generated ${PAGE_COUNT} HTML pages"
          if [ "$PAGE_COUNT" -lt 10 ]; then
            echo "ERROR: Too few pages (${PAGE_COUNT}). Check sphinx.log for import failures."
            exit 1
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: false
