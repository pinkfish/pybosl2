name: Docs Build Check

on:
  pull_request:
    branches: [main]
    paths:
      - "pybosl2/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/docs-check.yml"

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs,test]"

      - name: Build spec sheets
        run: |
          cd docs
          mkdir -p _extra/specs
          python3 _specgen.py

      - name: Validate example imports
        run: |
          python tests/validate_examples.py

      # `-W` is what makes this job a gate, and it catches a deleted hand-written page only
      # because the toctree entry for it lives in `_rstgen.py` (the generator) rather than in
      # `index.rst` (which the generator overwrites). With the link in the generated file, a
      # deletion took the link with it, nothing dangled, and the build passed with the page
      # silently absent -- which is exactly what happened to `getting_started.rst`. With the link
      # in the generator, the same deletion leaves `toctree contains reference to nonexisting
      # document` and this job fails (SPEC DOC-1a).
      - name: Build docs (warnings as errors)
        run: |
          echo '
          import importlib.util, os, sys
          if importlib.util.find_spec("pythonscad") is None:
              sys.path.insert(0, os.path.join(os.path.dirname(__file__), "tests"))
              import mock_libfive
          ' > sitecustomize.py
          PYTHONPATH=. python -m sphinx -W --keep-going \
            -b html docs/ wiki-check/ \
            -d docs/_build/doctrees/
          rm -f sitecustomize.py
