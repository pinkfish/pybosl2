repos:
  # Official repository for trailing-whitespace and end-of-file-fixer
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Official repository for Ruff linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format

  # mypy static type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.0
    hooks:
      - id: mypy
        args: [pybosl2, tests, pysolidfive]
        pass_filenames: false
        additional_dependencies: [numpy, typing-extensions, types-docutils]
