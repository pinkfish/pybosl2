Every construction that produces a **circle, arc, rounding, chamfer arc, sphere, cylinder, sweep, texture tile, flattened SVG curve, sampled field, or any other tessellated curve** MUST accept the facet controls — `fn`/`fa`/`fs` on the CSG side, `res` on the SDF side — and MUST **pass them through to every sub-construction it builds**. A part that rounds its corners hands its `fn` to the rounding; a gear hands it to its tooth arcs; a mask hands it to its profile; a sweep hands it to its cross-section. Dropping them part-way down is a defect.
