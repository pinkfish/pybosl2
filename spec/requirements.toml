]
status = "untriaged"

[[requirement]]
id = "SPEC-S-26d"
aliases = ["S-26d"]
layer = "contract"
section = "6.8 Masks, profiles and edge treatments"
title = "A mask profile is a shape."
statement = '''
~~2-D masks return a `Flat`, not a `Path2D`.~~ **Withdrawn** (§13 rule 5). Implementation showed it makes the primary use worse and breaks the layering: a 2-D mask exists to be *swept along an edge*, which needs a path, and the `Mask2D` factories are pure L0 — they build a `Path2D` out of arithmetic with no CAD runtime in sight, whereas `Path2D.polygon()` crosses the FFI. Returning a `Flat` would force every mask construction through a native runtime that A-2 says L0 must not need, to spare a `.polygon()` call in the rarer case. A mask profile is data; `.polygon()` is the one step to geometry when a caller wants it. S-26's "first-class" stands — it means the profiles are named, reusable values rather than inline point lists, which they are.
'''
enforced_by = []
status = "withdrawn"
note = '''
Withdrawn in the prose; see the statement.
'''

