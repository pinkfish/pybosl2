section = "6. Modules, imports, and laziness"
statement = '''
Import direction follows the spec's layering (SPEC A-1); a cycle is resolved by moving the shared piece down a layer, not by a function-local import — those are reserved for genuine cycles and are commented when used.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-E-P1"
aliases = ["E-P1"]
layer = "mechanics"
section = "7. Errors"
statement = '''
Raise `ValueError` for bad arguments, naming the parameter(s) and the accepted spellings: *"tube(): needs two of the three sizes — an inner radius/diameter, an outer radius/diameter, and a wall thickness."*
'''
enforced_by = []
