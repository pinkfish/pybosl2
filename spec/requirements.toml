statement = '''
A mask names its size measure the way the rest of the library does — `radius=`/`diameter=` through `pick_radius()` (D-5), not `r`; `width`/`depth`/`length` rather than `x`/`y` — and takes at most one required argument (D-2). `mask3d_groove(width, depth, length)` with three required positionals is the case D-2 says is never acceptable.
'''
enforced_by = []
candidates = [
    "tests/test_mask_contract.py::test_a_mask_names_its_size_measure_the_way_everything_else_does",
    "tests/test_mask_contract.py::test_no_public_masking_signature_mentions_a_native_type",
