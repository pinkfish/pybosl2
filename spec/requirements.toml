[[requirement]]
id = "SPEC-G-3"
aliases = ["G-3"]
layer = "contract"
section = "8.1 Argument tiers"
title = "The loose spellings survive, and conflicting with the group is an error."
keyword = "MUST"
statement = '''
Introducing a group MUST NOT withdraw the loose parameters. `cuboid([60, 40, 12], anchor=Anchor.BOTTOM)` is the common case and reads better than wrapping one value in a group; BOSL2's names are also kept for exactly this reason (B2-3). Supplying a group *and* one of its members MUST raise, naming both — the same rule and the same reasoning as a radius given beside its own diameter (D-5): the call cannot mean two things at once, and silently preferring one of them turns a typo into wrong geometry.
'''
enforced_by = [
    "tests/test_groups.py::TestPlacement::test_a_group_and_its_own_member_together_are_refused",
]
status = "enforced"

[[requirement]]
id = "SPEC-G-4"
