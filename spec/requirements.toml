[[requirement]]
id = "SPEC-S-26b"
aliases = ["S-26b"]
layer = "contract"
section = "6.8 Masks, profiles and edge treatments"
title = "Masks are applied by name, not by children."
statement = '''
The edge treatments take the *treatment*, not a native handle: `solid.round_edges(Anchor.TOP, radius=3)` and `solid.chamfer_edges(edges, chamfer=2)` are the spellings a caller should reach for, with `edge_mask(edges, mask)` remaining for a custom `Mask3D`. A parameter named `children` typed as a raw native object is OpenSCAD's module-with-children vocabulary surviving into a Python API, which B2-2 exists to replace, and it leaks an L2 type through an L3 signature (A-1).
'''
enforced_by = []
candidates = [
    "tests/test_mask_contract.py::test_a_named_treatment_needs_only_the_treatment",
    "tests/test_mask_contract.py::test_no_mask_factory_has_more_than_one_required_argument",
]
