Docs are generated from these headers and docstrings by `docs/_rstgen.py`, the visual catalogue by `docs/_specgen.py`, and the BOSL2 coverage table by `docs/_covgen.py`. Never hand-maintain a list of APIs in `.rst` — a generated page carries a "generated by" line, is committed alongside its generator, and has a test asserting the two still agree, so a forgotten re-run fails the build instead of publishing a stale page.
'''
enforced_by = []
