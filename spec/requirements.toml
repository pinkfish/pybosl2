[[requirement]]
id = "SPEC-S-2b"
aliases = ["S-2b"]
layer = "contract"
section = "6.1 Maths, points and vectors"
title = "One box type, one meaning."
keyword = "MUST NOT"
statement = '''
`bounds()` MUST return a `Bounds2D` or a `Bounds3D` — everywhere, on every type that has one: shapes on either backend, `Path2D`/`Path3D`, `Region`, `VNF`. It MUST NOT return a bare tuple, a NumPy array, or any other pair whose halves the caller has to guess at. `lo, hi = thing.bounds()` is the obvious reading of the name, and a method that answers a *centre* and a *size* to that read is a silent wrong answer, not an API. The box carries both spellings as properties — `min_x`…`max_z`, `center`, `size`, `width`/`length` /`height` — so no caller has to do the arithmetic and no implementation has to pick a winner. The raw backend pair stays private (`_native_bounds()`); the public name means one thing. A second public spelling of the same box on the same object (`bounding_box()` beside `bounds()`, `nominal_size` beside `size`) is the drift this rule exists to prevent — one concept, one name (C-21).
'''
enforced_by = [
    "tests/test_bounds_contract.py::test_every_bounds_is_a_bounds_object",
]
candidates = [
    "tests/test_bounds_contract.py::test_the_box_carries_every_spelling_of_itself",
    "tests/test_bounds_contract.py::test_unpacking_a_box_fails_loudly",
]
status = "enforced"

[[requirement]]
id = "SPEC-S-2a"
aliases = ["S-2a"]
layer = "contract"
section = "6.1 Maths, points and vectors"
keyword = "MUST NOT"
statement = '''
A shape's `size` is its **nominal anchor box**, and is not required to equal its bounding box. `anchor=` is measured against the box the shape is *designed* around — a gear's pitch circle, a regular polyhedron's circumsphere, the plate a snap fitting mounts on — so real geometry may sit inside it (a polyhedron inside its circumsphere) or stand outside it (gear teeth past the pitch circle, a truss clip's hooks past the cell it grips). `bounds()` reports the geometry and MUST prefer the native bounding box; it falls back to `size` only where no native box is available. A part whose `size` differs from its `bounds()` MUST say at the declaration which box it is naming and why. Tests MUST NOT assert that the two agree.
'''
enforced_by = []
candidates = [
    "tests/test_anchoring_parity.py::test_reanchor_records_the_anchor_where_a_nominal_box_exists",
    "tests/test_bounds_contract.py::test_bounds_tracks_the_geometry_through_a_boolean",
    "tests/test_nominal_anchor_box.py::test_a_differing_nominal_box_is_explained_at_its_declaration",
