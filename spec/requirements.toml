`Facets(fn, fa, fs, res)` exists, but as **plumbing**: it carries the four values down a call chain as one, which is what R-1 asks for and what a forwarding function most often gets wrong. It is not the spelling a caller should reach for, because resolution already has a better public answer — `use_defaults(fn=64)` sets it for a whole block without threading anything through any call (R-4), and a group passed to every call would be strictly worse. Every public callable taking `fn`/`fa`/`fs`/`res` SHOULD say so in its `Args:`, so a reader meets the ambient mechanism at the parameter rather than having to find `pybosl2.defaults`.
'''
