statement = '''
Where only one width will do, the check MUST be for the *concrete* type, not for `Path`. `Path2D` and `Path3D` are siblings, so a guard that asks only "is this a `Path`?" lets a `Path3D` satisfy a `Path2D` parameter and reach a formula that reads columns 0 and 1 and drops z — a wrong answer rather than a refusal, which is worse than the bare sequence this requirement set out to remove, because it is silent. `require_path(..., expect=Path2D)` performs it, and says how to convert.
'''
enforced_by = []
candidates = [
    "tests/test_polyline_parameters.py::test_polygon_area_is_planar_and_says_so",
]
status = "untriaged"

