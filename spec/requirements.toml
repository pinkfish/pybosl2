statement = '''
A constructor in `solid.py`/`flat.py` carries its own `Args:` for every parameter it declares and its own example — delegating to a backend module documents the backend, not the entry point users are told to use (SPEC DOC-2). Where the resolved default differs per backend, say what it resolves to and point at `effective_defaults()`.
'''
