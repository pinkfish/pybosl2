]
status = "untriaged"

[[requirement]]
id = "SPEC-C-7a"
aliases = ["C-7a"]
layer = "contract"
section = "5.2 Geometry objects"
keyword = "MUST NOT"
statement = '''
A public parameter that means *an ordered set of points* — a path, outline, profile, polygon or point list — MUST be typed as `Path2D`, `Path3D` or `Path`, and MUST NOT accept a bare `Sequence[Sequence[float]]` or a NumPy array. **The point type is the contract, not a convenience wrapper over one.** A bare sequence carries no dimension, no open/closed flag and no winding, so each function that takes one has to re-derive all three, and they do not always agree — the same list is a 2-D outline to one function and a degenerate 3-D path to the next. Requiring the type moves that decision to the one place that can make it once, at construction. A caller with raw points writes `Path2D(pts)`, which is where the points get checked.
'''
enforced_by = [
    "tests/test_polyline_parameters.py::test_no_new_parameter_takes_raw_points",
]
candidates = [
    "tests/test_polyline_parameters.py::test_a_path_annotation_is_backed_by_a_guard",
    "tests/test_polyline_parameters.py::test_as_path_list_no_longer_guesses_one_path_from_many",
    "tests/test_polyline_parameters.py::test_path_copies_reads_closed_off_the_path_instead_of_guessing",
    "tests/test_polyline_parameters.py::test_the_closure_helpers_refuse_raw_points",
    "tests/test_polyline_parameters.py::test_the_guard_checks_the_width_not_merely_that_it_is_a_path",
    "tests/test_polyline_parameters.py::test_the_last_tranche_refuses_raw_points",
    "tests/test_validation_messages.py::test_extrusion_and_text_rejections",
    "tests/test_vnf.py",
]
status = "enforced"

[[requirement]]
