statement = '''
No native runtime at import time. PythonSCAD primitives are reached through `pybosl2._native.native("cube")`, which defers `import pythonscad` to the first call; libfive is a lazy handle in `pybosl2/sdf/_libfive.py`. `import pybosl2` MUST work with neither installed.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
