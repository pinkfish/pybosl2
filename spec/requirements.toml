[[requirement]]
id = "PLAN-X-4"
aliases = ["X-4"]
layer = "mechanics"
section = "9. Tests"
keyword = "MUST"
statement = '''
Contract tests that guard the rules in this plan, and MUST keep passing: | Test | Guards | |---|---| | `tests/test_defaults.py::test_no_mutable_defaults_anywhere_in_the_package` | T-10 / SPEC D-3 | | `tests/test_defaults.py::test_argument_free_constructors_either_build_or_explain` | SPEC P-1, E-P2 | | `tests/test_defaults.py::test_facade_never_defaults_an_argument_its_backend_requires` | SPEC P-1 | | `tests/test_defaults.py::test_backends_agree_on_the_defaults_they_share` | SPEC P-2 | | `tests/test_init_stub.py` | T-8 | | `tests/test_facets.py` | R-P2 / R-P5 | | `tests/test_defaults.py::test_a_radius_and_its_own_diameter_together_are_rejected` | E-P5 / SPEC D-5 | | `tests/test_docs_links.py` | D-P6 / D-P6a | | `tests/test_exports.py::test_every_polyline_parameter_accepts_a_path` | T-4 / SPEC C-7 | | `tests/test_bosl2_coverage.py` | D-P7 / SPEC B2-1 | | `tests/test_validation_messages.py` | E-P1 / E-P2 / SPEC E-4 (X-7) | | `tests/test_validation_messages.py::test_no_cover_pragmas_are_attached_to_a_statement` | X-7 |

Tests the rules still need (they land with their tasks in [TASKS.md](TASKS.md)):

| Test to add | Guards | Task | |---|---|---| | a CSG shape built inside `use_backend("sdf")` reports `backend == "csg"` | O-6a / SPEC C-1 | T0 | | no `assert` carries a message naming a caller-supplied parameter | E-P2 / SPEC E-4 | T0b | | no message-less `assert` and no `raise AssertionError` validates input | E-P2 / SPEC E-4 | T10 | | `shape` is a property on every class in `pybosl2.parts.__all__` | O-2 / SPEC C-14 | T0c | | every name in every public `__all__` resolves | M-2 / SPEC A-7 | T0d | | every top-level shape name yields the active backend or refuses | M-2a / SPEC A-6 | T2b | | every part built under `use_backend("sdf")` is SDF-backed or refuses | O-0a / SPEC S-46a | T0f | | every name in `CSG_ONLY_FEATURES` is genuinely absent from the SDF shape | B-P4 / SPEC PAR-3 | T4 | | `tests/test_backend_matrix.py` | SPEC B-7, PAR-2, B-P1 (a new shared feature lands on both backends or is an explicit, tracked refusal) |
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-X-7"
aliases = ["X-7"]
layer = "mechanics"
section = "9. Tests"
statement = '''
Every rejection path is exercised, asserting the **message** as well as the type (`tests/test_validation_messages.py`) — E-4 is about the message naming the fix, and an unexercised `raise` is an unverified one. A guard that genuinely cannot fire is marked `# pragma: no cover` **on the `if`/`else` header**, with the reason in a comment below it: coverage matches the pragma against a line, so a marker on its own comment line excludes nothing. `test_no_cover_pragmas_are_attached_to_a_statement` enforces the placement.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-X-8"
aliases = ["X-8"]
layer = "mechanics"
section = "9. Tests"
title = "A test asserts what the result *is*, never merely that it exists."
keyword = "MUST"
statement = '''
`assert isinstance(result, Bosl2Solid)` passes for every wrong answer that is still a solid: the wrong size, the wrong place, an empty union, a cut that removed everything. It proves the call returned, which the absence of an exception already proved. Every test MUST make at least one assertion about the *content* of what it built:
* **Solids and 2-D shapes** — `bounds()` (centre and size), or a dimension derived from it. A half-cut halves an extent; an offset grows one; a spread separates two centres. These are cheap, exact, and they fail when the geometry is wrong.
* **Paths and regions** — point counts, endpoints, x/y span, closure, winding, perimeter or area. For anything symmetric, assert the symmetry.
* **Meshes** — `VNF` vertex/face counts, signed volume, watertightness.
* **Anything with a backend** — the `backend` tag as well as the type (SPEC C-1).

Measure `bounds()`, never `size`. `size` is the **nominal anchor box** (SPEC S-2a), which is allowed to differ from the geometry — asserting `shape.size == [...]` states what the constructor was handed, not what it built, and passes however wrong the geometry is. Where a test needs both, assert them as two separate claims and say which is which.

A type assertion is a legitimate *addition* to those, and it is the whole point only in a contract test whose subject genuinely is the type — "the façade returns the active backend's class", "a part refuses on the SDF backend". Those state the type claim in the test name.

The cost of getting this wrong is not hypothetical: `pybosl2/partitions.py` was 60% covered with a suite full of `isinstance` checks that all passed while the code they claimed to test was never executed at all (its methods were shadowed by a duplicate), and two of its features were outright broken (see [TASKS.md](TASKS.md) T12).
'''
