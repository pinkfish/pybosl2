layer = "mechanics"
section = "2. Typing"
title = "The shape protocols are one hierarchy."
statement = '''
SPEC C-15 requires `Shape` with `Flat` and `Solid` derived from it. In Python that is three `Protocol`s in the L1 contract module, with the shared members typed to return `Self`:

```python
  class Shape(Protocol):
      backend: str

      def __or__(self, other: Self) -> Self: ...
      def translate(self, v: Sequence[float]) -> Self: ...
      def bounds(self) -> Bounds2D | Bounds3D: ...


  class Flat(Shape, Protocol):
      def linear_extrude(self, height: float, **kwargs: Any) -> "Solid": ...


  class Solid(Shape, Protocol):
      def projection(self, cut: bool = False) -> Flat: ...
```

`Self` is what makes SPEC C-16 static: `flat | flat` checks, `flat | solid` does not, with no runtime guard and no `TypeVar` machinery. A shared member MUST NOT be re-declared on `Flat` or `Solid` — re-declaring is how the two drifted apart in the first place.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-T-6c"
aliases = ["T-6c"]
layer = "mechanics"
section = "2. Typing"
title = "The protocol declares everything the object does."
statement = '''
SPEC C-20: a public attribute on `CsgSolid`, `SdfSolid`, `CsgShape2D` or `PyShape2D` that no protocol declares is a defect, not an extra. Write the member on `Shape` if both dimensions can honour it (C-22), on `Flat`/`Solid` only if it is genuinely dimensional. Where the two backends' concrete signatures differ in ways the checker cannot reconcile, the protocol declares the **caller's** view and the parameter is typed `Any` with a comment saying which two spellings it is bridging — that is a T-2 exception earned by the contract, and it is bounded by the allowlist in `tests/test_shape_contract.py::test_the_contract_is_the_whole_object`. Prefer widening the protocol to shrinking the object: a method users already call does not stop existing because it is inconvenient to type.
'''
enforced_by = []
candidates = [
    "tests/test_shape_contract.py",
]
status = "untriaged"

[[requirement]]
id = "PLAN-T-6d"
aliases = ["T-6d"]
layer = "mechanics"
section = "2. Typing"
title = "A return type does not depend on a flag."
statement = '''
SPEC S-19b. A `bool` parameter that selects which arm of a union comes back is a second function wearing the first one's name: split it (`path_sweep` / `path_sweep_transforms`). The only unions a public return may carry are ones the *caller's own input* selects — a façade returning `Flat` or `Solid` by dimension — and even those need `@overload` so the checker can narrow. Guarded by `tests/test_exports.py::test_no_public_return_type_is_a_flag_selected_union`.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-T-6b"
aliases = ["T-6b"]
layer = "mechanics"
section = "2. Typing"
title = "Protocol members must be real methods."
keyword = "MUST"
statement = '''
Since Python 3.12, `isinstance()` against a `runtime_checkable` Protocol uses static lookup and ignores anything `__getattr__` supplies. A member that exists only through a dynamic passthrough therefore fails the check even though the call works — which is how `show()` was absent from every shape contract while appearing to be present. Anything in a contract MUST be declared on the class.
'''
enforced_by = []
candidates = [
    "tests/test_backend_capabilities.py::test_csg_attachment_features_unsupported_on_sdf",
    "tests/test_backend_parity.py::test_every_csg_only_feature_refuses_on_the_sdf_shape",
    "tests/test_shape_contract.py::test_the_object_has_everything_the_contract_declares",
    "tests/test_supported_versions.py",
]
status = "untriaged"

[[requirement]]
id = "PLAN-T-6e"
aliases = ["T-6e"]
layer = "mechanics"
section = "2. Typing"
title = "A runtime-checkable Protocol declares no property that does work."
statement = '''
`isinstance()` against such a Protocol calls `hasattr()` on **every** declared member, and `hasattr` on a property *evaluates* it. So a property that meshes, renders, crosses the FFI, or can raise turns a type check into that work — silently, on every call — and, when the work fails, into an exception escaping the check itself, because `hasattr` catches `AttributeError` and nothing else.

`Solid.vnf` was declared as a property and did exactly this: `isinstance(shape, Solid)` meshed an SDF field, and on a machine with no mesher available the resulting `Bosl2ValueError` propagated out of the `isinstance` call. Two backend tests failed with a mesh error from inside a type check.

**This rule and T-6b are two halves of one version change, and the library must satisfy both.** Python 3.11 resolves a protocol `isinstance` with `hasattr`; 3.12 changed it to a static lookup. So on 3.11 a property on a contract is evaluated (this rule) but a member supplied by `__getattr__` is found; on 3.12+ the property is safe but the dynamic member is invisible (T-6b). `requires-python` is `>=3.11`, so code that satisfies only one of the two is broken for some supported interpreter — and, worse, is broken *invisibly* on whichever one the developer happens to run. That is exactly how this reached CI: it is unobservable on 3.12 and later.

`tests/test_no_mesher.py` is the guard, and it probes with `hasattr` directly as well as through `isinstance` so it fails on every interpreter rather than only on 3.11.

So: anything on a contract that computes is a **method** (`bounds()`, `vnf()`, `volume()`, `show()`); a property on a contract is a cheap, total accessor over state the object already holds (`backend`, `size`). This is the same failure family as E-6 — code that probes an object must get an answer, not a traceback — arriving through `isinstance` rather than `getattr`.
'''
enforced_by = []
candidates = [
    "tests/test_beziers.py",
    "tests/test_no_mesher.py::test_isinstance_answers_without_meshing",
    "tests/test_shape_contract.py::test_no_contract_member_is_a_property_that_computes",
    "tests/test_skin.py",
    "tests/test_supported_versions.py",
]
status = "untriaged"

[[requirement]]
id = "PLAN-T-7"
aliases = ["T-7"]
layer = "mechanics"
section = "2. Typing"
title = "Variance is explicit."
statement = '''
`TypeVar("T", covariant=True)` / `contravariant=True` where a generic is exposed publicly.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-T-8"
aliases = ["T-8"]
layer = "mechanics"
section = "2. Typing"
title = "Stubs for dynamic surfaces, and *only* for those."
keyword = "MUST NOT"
statement = '''
A module whose public names are bound dynamically MUST ship a `.pyi` that declares them statically — `pybosl2/__init__.pyi`, `shapes2d/__init__.pyi`, `shapes3d/__init__.pyi`, `_shape.pyi`. A module whose functions are ordinary `def`s with full annotations MUST NOT: the stub shadows the truth and can only drift from it. `solid.pyi` was exactly that and had — it declared `cube` with five parameters where the module has fifteen, so `cube(size=20, chamfer=2)` failed the checker while working perfectly, and the docstring example that wrote it was reported as the defect. It is deleted.

A stub and its module MUST NOT drift; parity is enforced by `tests/test_init_stub.py`, and the docstring-example gate (D-P5a) is what catches the drift a parity test does not model.
'''
enforced_by = []
candidates = [
    "tests/test_turtle_stub.py::test_the_stub_exists",
]
status = "untriaged"

[[requirement]]
id = "PLAN-T-9"
aliases = ["T-9"]
layer = "mechanics"
section = "2. Typing"
title = "No dynamic globals."
statement = '''
Never `globals()[name] = …` or `setattr(module, …)` to register an API. The one permitted `__getattr__` is the top-level lazy re-export table, which is backed by its stub (T-8).
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-T-9a"
aliases = ["T-9a"]
layer = "mechanics"
section = "2. Typing"
title = "Keyword-only is a `*` in the signature."
statement = '''
Everything past the subject argument goes after a bare `*` (SPEC D-1), so no caller can depend on positional order for shaping, placement, resolution or escape-hatch parameters. A public callable carries at most one required parameter; a second needs a `Note:` in the docstring saying why no default can invent it (SPEC D-2), and a third is never acceptable.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-T-9b"
aliases = ["T-9b"]
layer = "mechanics"
section = "2. Typing"
title = '`None` means "decide for me", never "off".'
statement = '''
"Off" is `0`, `False`, or an enum member (`ScrewDriveType.NONE`) — SPEC D-4. A parameter whose `None` means "do not apply this" is a defect: it makes "unset" and "disabled" indistinguishable, which is what breaks ambient defaults (§4.3) and `effective_defaults()`.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-T-10"
aliases = ["T-10"]
layer = "mechanics"
section = "2. Typing"
title = "Immutable defaults."
statement = '''
Parameter defaults are `None`, numbers, strings, tuples, or enum members — never a list, dict, or set, in `.py` or `.pyi` (SPEC D-3). Guarded by `tests/test_defaults.py::test_no_mutable_defaults_anywhere_in_the_package`.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-0"
aliases = ["O-0"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Every subsystem is on the map."
statement = '''
SPEC §6 catalogues the subsystems this library owns — paths and curves, regions, meshes and surfaces, sweeps, strokes and caps, masks, partitions, distribution, textures, colour, import/interchange, parts. New work belongs to one of them; if it does not, the spec gains a subsection before the code lands.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-0a"
aliases = ["O-0a"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Parts build through the façade."
statement = '''
A part imports `pybosl2.solid` / `pybosl2.flat`, never `pybosl2.shapes3d` / `pybosl2.shapes2d` directly, so it honours the active backend (SPEC S-46a). Reaching a backend module directly is what makes a part silently CSG-only.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-1"
aliases = ["O-1"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Parts are classes."
keyword = "MAY"
statement = '''
Every entry in `pybosl2/parts/` is a class — `Screw`, `SpurGear`, `KnuckleHinge`, `RegularPolyhedron`, `NemaMotor` — not a family of functions. A stateless family of catalogue lookups MAY instead be a class holding classmethod factories (`BallBearings.ball_bearing("608")`).
'''
enforced_by = []
candidates = [
    "tests/turtle/test_turtle_methods.py",
]
status = "untriaged"

[[requirement]]
id = "PLAN-O-1a"
aliases = ["O-1a"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Prefixed function families are factories on a class."
statement = '''
A group of free functions sharing a prefix and a parameter list is an argument bag with extra steps (SPEC P-8): give the group a class and make each member a factory on it — `Metaball.sphere(...)`, `Mask2D.roundover(...)`, `Mask3D.chamfer(...)`. The old names stay as **aliases of the new members** (`mask2d_roundover = Mask2D.roundover`), never as a second copy of the body, so the two spellings cannot diverge.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-1c"
aliases = ["O-1c"]
layer = "mechanics"
section = "3. Objects over functions"
title = "A mixin is inherited or it is deleted."
keyword = "MUST"
statement = '''
Where a class publishes operations through a mixin, that mixin MUST be in the class's MRO — never re-implemented in the class alongside it. A duplicate is dead on one side: `partitions.Partitionable` held all nine cut operators while `shapes3d/base.py` carried its own copy of every one, so the mixin was documented, tested and never executed, and the two copies had already drifted. If a mixin looks redundant, delete it; do not leave two implementations of one operation.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-1b"
aliases = ["O-1b"]
layer = "mechanics"
section = "3. Objects over functions"
title = "A command enum plus a parameter dataclass gets methods too."
statement = '''
Where an API is driven by `Thing(CommandType.MOVE, size=40)` values, the object executing them also exposes one method per command, generated from a single table so parallel implementations cannot drift (`TurtleCommands`, mixed into `Turtle2D` and `Turtle3D`). The command objects remain the substrate — the methods build them — so generated programs still work.
'''
enforced_by = []
candidates = [
    "tests/test_turtle_stub.py",
]
status = "untriaged"

[[requirement]]
id = "PLAN-O-2"
aliases = ["O-2"]
layer = "mechanics"
section = "3. Objects over functions"
title = "The standard part shape."
statement = '''
A part class has: 1. a `__init__` taking the catalogue name / defining dimension first and everything else defaulted (SPEC P-1), 2. a resolved, frozen **spec object** — `ScrewSpec`, `GearSpec`, `BearingSpec`, `NemaSpec` — built on the first line of `__init__`, 3. read-only `@property` accessors for every derived dimension (`diameter`, `pitch`, `pitch_radius`, `head_height`) so callers can measure without building geometry, 4. a **`@property` named `shape`** returning the `Solid`/`Flat`, built on first access and cached in a private attribute — `part.shape`, never `part.shape()`. **The validation stays in `__init__`.** A part separates three things, not two: validate the arguments, resolve the derived dimensions, then build. Deferring the validation along with the geometry means a rejected call stops raising until someone asks for a shape, which is E-4 and E-5 undone — the caller learns about their mistake at a call they did not make. `Slider` (`pybosl2/parts/sliders.py`) is the worked example; `tests/test_parts_are_lazy.py` counts what is left, 5. a `show()` for the interactive/preview case.

Beware the name: on a backend wrapper, `.shape` is the *raw native handle* (SPEC C-14a). A part's `shape` returns the wrapped `Solid`; a wrapper's returns what it wraps.
'''
enforced_by = []
candidates = [
    "tests/test_exports.py::test_every_part_exposes_shape_as_a_property",
    "tests/test_parts_are_lazy.py::test_no_part_becomes_eager",
]
status = "untriaged"

[[requirement]]
id = "PLAN-O-3"
aliases = ["O-3"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Geometry types are classes too."
statement = '''
`Path2D`, `Path3D`, `Region`, `VNF`, `Bezier`, `NurbsCurve`, `Color`, `Bounds2D/3D` own their operations as methods, so work reads as a fluent chain rather than nested calls.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-4"
aliases = ["O-4"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Free functions are for shape constructors and pure maths."
statement = '''
`cuboid()`, `circle()`, `slerp()`, `frag_count()` stay functions; anything with state, derived values, or a catalogue behind it becomes a class.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-5"
aliases = ["O-5"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Immutability."
statement = '''
Spec objects are frozen dataclasses. Shapes and paths return new objects from every operation (SPEC C-3); no public method mutates `self`. The pattern is copy-then-set — `out = self._wrap(self.shape); out.tag_name = …; return out` — so the `attachments`/`tag_name` setters exist for the copy to use and are never part of the public call surface.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-5b"
aliases = ["O-5b"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Derived values are computed, then exposed."
statement = '''
A value that follows from the others is computed once — in the frozen spec object or on the first line of `__init__` — and surfaced as a read-only property, never demanded from the caller (SPEC P-3, D-6). `ScrewSpec` deriving pitch from `"M6"` and `GearSpec` deriving pitch radius from teeth+module are the patterns to copy.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-6"
aliases = ["O-6"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Enums for closed vocabularies."
statement = '''
`StrEnum` in `pybosl2/enums.py` and `pybosl2/parts/enums.py`, so the legacy string spelling still compares equal. A new bare-string parameter with a fixed set of accepted values is a defect.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-5a"
aliases = ["O-5a"]
layer = "mechanics"
section = "3. Objects over functions"
title = "`show()` returns the shape."
statement = '''
Every implementation of `show()` returns `Self`, never `None` (SPEC S-49), so it can close a chain: `part = cuboid([20, 20, 10]).up(5).show()`. A builder's `show()` delegates to its `shape`'s and returns the same way.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-6a"
aliases = ["O-6a"]
layer = "mechanics"
section = "3. Objects over functions"
title = "The backend tag is a class constant."
keyword = "MUST NOT"
statement = '''
A wrapper declares `backend = "csg"` (or `"sdf"`) as a class attribute; it MUST NOT be assigned from `current_backend()` in `__init__`. The tag says *who built this object*, not *what was selected when it happened* (SPEC C-1), and reading the ambient value there silently disables the cross-backend guard.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-6b"
aliases = ["O-6b"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Anchors use the anchor language."
statement = '''
A parameter meaning "which face, edge or corner" is typed `Anchor | Sequence[float]` and resolved through `resolve_anchor()` (SPEC C-10). Do not accept a bare string like `"top"` or an integer index — that is a parallel vocabulary the reader has to learn twice. `constants.TOP` is an alias of `Anchor.TOP`; new code and examples use the enum spelling (SPEC C-11).
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-6c"
aliases = ["O-6c"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Caps are one value."
statement = '''
A stroke or sweep end treatment is typed `CapType | CapSpec` and normalised once through `caps.norm_caps()` (SPEC S-23, S-24), so `endcap1=`/`endcap2=`/`joints=` each take a single argument rather than a spread of style, size and shape parameters.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-O-7"
aliases = ["O-7"]
layer = "mechanics"
section = "3. Objects over functions"
title = "Composition at the FFI boundary."
statement = '''
`Bosl2Solid`/`Bosl2Shape2D` wrap the native handle by composition, never inheritance, and proxy operations through the explicit `_NATIVE_PASSTHROUGH` allowlist (SPEC C-6).
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-F-P1"
aliases = ["F-P1"]
layer = "mechanics"
section = "4.1 Façade constructors"
statement = '''
A façade constructor declares the **real default** for each shared argument in its own signature — `size: float | Sequence[float] = (1, 1, 1)`, `anchor: Anchor = Anchor.CENTER` — and always forwards it. It does not default shared arguments to `None` and hope the backend agrees.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-F-P2"
aliases = ["F-P2"]
layer = "mechanics"
section = "4.1 Façade constructors"
statement = '''
Forwarding is filtered by **what the target backend declares**, not by what the caller passed: inspect the backend constructor's signature (cached per callable, as `_takes_res` does) and drop names it does not accept. `given_arguments()` remains the filter for backend-exclusive options only.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-F-P3"
aliases = ["F-P3"]
layer = "mechanics"
section = "4.1 Façade constructors"
statement = '''
A backend-exclusive option keeps its default on the backend, and the façade documents which backend it applies to (`res` for SDF; `spin`/`orient`/`fn`/`fa`/`fs` for CSG).
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-F-P4"
aliases = ["F-P4"]
layer = "mechanics"
section = "4.1 Façade constructors"
keyword = "MUST"
statement = '''
`effective_defaults()` MUST keep reporting the truth after any change here — it reads live off the constructor, so the test for it is that it needs no maintenance.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-B-P1"
aliases = ["B-P1"]
layer = "mechanics"
section = "4.2 Backend implementations"
title = "Both backends, or an explicit refusal."
statement = '''
A new shared feature is implemented on both backends, or it raises `UnsupportedByBackendError` **and** is listed in `CSG_ONLY_FEATURES` / `SDF_ONLY_FEATURES` with its reason (SPEC PAR-2, PAR-3). Silently omitting it from one backend is the failure mode those lists exist to prevent.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-B-P2"
aliases = ["B-P2"]
layer = "mechanics"
section = "4.2 Backend implementations"
title = "Name differences live in one table."
statement = '''
Where a backend's own module spells a parameter differently, the mapping goes in that backend's translation table (`SdfBackend._OWN_NAMES`), never into the façade signature (SPEC PAR-4).
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-B-P3"
aliases = ["B-P3"]
layer = "mechanics"
section = "4.2 Backend implementations"
title = "Guard operands, do not assume."
statement = '''
Boolean and transform implementations call `check_operand_backend()` before touching an operand, so a mismatch raises `CrossBackendError` with its conversion hint rather than an internal `AssertionError` from deeper in (SPEC C-1, E-3).
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-B-P4"
aliases = ["B-P4"]
layer = "mechanics"
section = "4.2 Backend implementations"
title = "An exclusive-feature list is checked, not just written."
statement = '''
Every name in `CSG_ONLY_FEATURES` must be implemented on the SDF shape **as a refusal**, and vice versa (SPEC PAR-3): a real method whose whole body raises `UnsupportedByBackendError` with a hint. The test is that calling it raises and that the message names the way forward — not that the attribute is missing, which would break `isinstance` against the shape protocols (T-6b) and make the refusal less explicit than C-13 asks for. What must never happen is the third case: a name that is listed as exclusive and *works anyway*, so the refusal never fires (as `projection` once did).
'''
enforced_by = []
candidates = [
    "tests/test_backend_parity.py::test_every_csg_only_feature_refuses_on_the_sdf_shape",
    "tests/test_backend_parity.py::test_the_mesh_operation_list_only_holds_names_that_reach_the_fallback",
]
status = "untriaged"

[[requirement]]
id = "PLAN-R-P1"
aliases = ["R-P1"]
layer = "mechanics"
section = "4.3 Resolution plumbing (`fn` / `fa` / `fs` / `res`)"
statement = '''
The parameters are spelled `fn: int | None = None`, `fa: float | None = None`, `fs: float | None = None` (CSG) and `res: int | None = None` (SDF), keyword-only, defaulting to `None`. Never `$fn`, never a positional.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-R-P2"
aliases = ["R-P2"]
layer = "mechanics"
section = "4.3 Resolution plumbing (`fn` / `fa` / `fs` / `res`)"
keyword = "MUST"
statement = '''
A function that builds an arc, circle, rounding, chamfer arc, sphere, or cylinder MUST declare them, and MUST forward them to every sub-construction it calls — including path helpers (`round_corners`, `arc_points`), masks, and part sub-assemblies. Dropping them silently half-way down is the defect this rule exists to prevent. Per SPEC R-1a the trigger is *generating points that approximate a curve*: a function that only places or measures from a radius (`arc_copies`, `polar_to_xy`, `circle_circle_tangents`) is out of scope, because nothing it returns has a facet count.
'''
enforced_by = []
candidates = [
    "tests/test_facets.py",
]
status = "untriaged"

[[requirement]]
id = "PLAN-R-P3"
aliases = ["R-P3"]
layer = "mechanics"
section = "4.3 Resolution plumbing (`fn` / `fa` / `fs` / `res`)"
keyword = "SHOULD"
statement = '''
Resolve them exactly once, at the point of use, through `pybosl2.defaults.resolve_facets()` / `resolve_res()`, which fill in the ambient block values (`use_defaults(fn=64)`). The central resolvers are `_helpers.frag_count()`, `shapes3d/base._ocylinder`/`_osphere`, `shapes2d/circle.circle`, and each backend's `construct()`; new leaf constructors SHOULD route through those rather than re-implementing the `$fa`/`$fs` arithmetic.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-R-P4"
aliases = ["R-P4"]
layer = "mechanics"
section = "4.3 Resolution plumbing (`fn` / `fa` / `fs` / `res`)"
statement = '''
