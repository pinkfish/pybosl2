[[requirement]]
id = "SPEC-PAR-3"
aliases = ["PAR-3"]
layer = "contract"
section = "7.1 Backend parity"
title = "The exclusive lists are minimal and justified."
keyword = "MUST"
statement = '''
`CSG_ONLY_FEATURES` and `SDF_ONLY_FEATURES` are the single source of truth for what is exclusive, and each entry MUST carry the reason it cannot cross over. An exclusive feature is **declared and refuses**, not absent: the backend that lacks it implements the method and raises `UnsupportedByBackendError` naming the way forward (B-4). Two reasons. C-13 asks the SDF backend to refuse attachment *explicitly*, and a method that says why is more explicit than a missing name. And since Python 3.12 an `isinstance` check against a runtime-checkable protocol uses static lookup, so a member supplied only by a dynamic fallback makes `isinstance(sdf_solid, Solid)` false for a perfectly good solid — which is how the contract would come to exclude the very shapes it describes. A caller that needs to know *before* calling consults the exclusive list, not the shape. Today that is the attachment/anchor system (CSG-only, because anchoring needs a shape's face and edge structure, which a distance field does not retain), `projection` and `fill` (CSG-only, because a 2-D shadow of a solid and a filled outline are not derivable in closed form from a field — both backends *do* build 2-D shapes otherwise), and the implicit-surface `round`/`chamfer` methods that survive transforms (SDF-only, because CSG expresses those as constructor parameters). An entry that becomes implementable MUST be removed from the list, not left as a permanent excuse; the list is re-reviewed whenever either backend gains a capability.
'''
enforced_by = []
candidates = [
    "tests/test_backend_capabilities.py::test_csg_attachment_features_unsupported_on_sdf",
    "tests/test_backend_parity.py::test_every_csg_only_feature_refuses_on_the_sdf_shape",
