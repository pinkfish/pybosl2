layer = "contract"
section = "6.6 Sweeps, skins and extrusions"
title = "A return type is one type."
keyword = "MAY"
statement = '''
No public callable MAY return a union whose arm is selected by one of its own boolean parameters. `path_sweep(..., transforms=True)` returning a list of matrices instead of geometry is the pattern this forbids: it makes the union unavoidable, so every caller of the *ordinary* case pays for the flag with a narrowing they cannot skip, and the documented one-liner stops type-checking. A flag that changes the return type is a second function — name it (`path_sweep_transforms()`), and let each return one thing.
'''
