2-D mask profiles (`mask2d_roundover`, `mask2d_chamfer`, `mask2d_cove`, `mask2d_tear`, `mask2d_step`, `mask2d_groove`, …) and 3-D masks (`mask3d_roundover`, `mask3d_chamfer`, `mask3d_groove`) are first-class shapes, usable on their own or through a solid's `edge_mask`/`edge_profile`/`edge_profile_asym`/`corner_profile`/`face_profile`.
