[[requirement]]
id = "SPEC-A-1"
aliases = ["A-1"]
layer = "contract"
section = "4. Architecture"
keyword = "MUST NOT"
statement = '''
A lower layer MUST NOT import a higher one. The layers, their members and the edges that break the rule today are data (`spec/layers.toml`), walked by `tests/test_layering.py`: a new runtime up-import fails, a deferred one is allowed only where it breaks a genuine cycle — which the test resolves in the import graph rather than accepting from a comment (PLAN M-5) — and the list of existing violations only shrinks. Stating this rule for years without measuring it left 18 of them.
'''
enforced_by = [
    "tests/test_layering.py::test_every_runtime_upward_import_is_known_debt",
]
candidates = [
    "tests/test_mask_contract.py::test_no_public_masking_signature_mentions_a_native_type",
]
status = "enforced"
note = '''
Measured for the first time in T29. The layer table this rule referred to could not describe the code even in principle — it placed exceptions/enums/_edges_lang above pure geometry, which every geometry module imports — so the model was corrected before the rule could be applied at all. Against the corrected model: 18 runtime up-edges, now a ratchet in spec/layers.toml, and 10 deferred ones that break a genuine cycle, which the test resolves in the import graph rather than accepting from a comment.
'''

[[requirement]]
id = "SPEC-A-10"
aliases = ["A-10"]
layer = "contract"
section = "4. Architecture"
title = "A geometry object reaches geometry through the façade."
keyword = "MUST"
statement = '''
Where an L2 type builds a shape — `Path2D.polygon()`, `linear_extrude()`, `stroke()`, the sweeps — it MUST build through the L4 façade and return `Flat`/`Solid`, never import a backend module and return that backend's class. Reaching `shapes2d`/`shapes3d` directly is an A-1 violation, leaks an L3 type through an L2 signature, and — since the constructor it reaches is one backend's — silently produces a CSG shape inside `use_backend("sdf")`, which is A-6's defect arriving by a different road and, with the SDF backend a full-parity target, a PAR-1 defect too. S-11 requires a path to *become geometry*; this says which door it goes through.
'''
enforced_by = [
    "tests/test_layering.py::test_every_runtime_upward_import_is_known_debt",
]
status = "enforced"

