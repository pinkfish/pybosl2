[[requirement]]
id = "PLAN-D-P5"
aliases = ["D-P5"]
layer = "mechanics"
section = "5. Documentation"
title = "Examples that build geometry."
keyword = "MUST"
statement = '''
Every function producing 2-D or 3-D output carries a `.. pythonscad-example::` block that renders to STL. A 2-D example MUST extrude (`.linear_extrude(...)`) before `.show()`, since STL has no 2-D form.
'''
enforced_by = []
candidates = [
    "tests/test_docs_links.py::test_every_facade_callable_documents_its_arguments_and_shows_an_example",
]
status = "untriaged"

[[requirement]]
id = "PLAN-D-P5a"
aliases = ["D-P5a"]
layer = "mechanics"
section = "5. Documentation"
title = "Every example is type-checked with `mypy --strict`."
statement = '''
SPEC DOC-5, Q-6. An example is user code — it is the code a caller copies — so it is held to exactly what this plan asks of user code, and an example the checker rejects is a **signature defect the docs found first**, to be fixed in the signature rather than worked around in the prose.

The mechanics: `tests/test_docstring_examples.py` walks every public module, extracts each `.. pythonscad-example::` block (and every `>>>` doctest) with the same parser the docs build uses, writes each one to a file in a temp directory, and runs one batched `mypy --strict` over the lot. A failure reports the owning callable, the example, and mypy's message together, so the fix is obvious from the test output alone.

Rules for writing an example so this stays cheap:
* **Imports are real and complete.** The block starts with the `from pybosl2 import …` a caller would need; no implicit names, no `...` elisions, no reliance on a doc-build preamble.
* **No `# type: ignore`.** An example is the wrong place to suppress an error — if the example needs one, the signature is wrong (that is the point of the rule).
* **Annotate only where inference genuinely fails.** Examples should read like a user wrote them, not like a stub file.
* A block that is deliberately not runnable Python — a shell command, a `.scad` fragment shown for comparison — uses a plain `code-block` directive, not `pythonscad-example`, so it is not collected.

Because it type-checks rather than executes, the gate needs no CAD runtime and runs in CI. It is not a substitute for D-P5's rendering — one proves the example *compiles*, the other that it *builds something*.
'''
enforced_by = []
candidates = [
    "tests/test_docstring_examples.py::test_no_example_suppresses_a_type_error",
    "tests/test_docstring_examples.py::test_no_module_grows_its_untyped_examples",
]
status = "untriaged"

[[requirement]]
id = "PLAN-D-P5b"
aliases = ["D-P5b"]
layer = "mechanics"
section = "5. Documentation"
title = "An example that states a value is held to it."
statement = '''
A trailing comment on a printed expression is an assertion in prose:

```python
  print(bracket.bounds().size)  # (60.0, 40.0, 18.0)
```

Nothing else checks it. D-P5a proves the line *compiles*; D-P5 renders the *geometry* and never reads the printed text. So a number written from intuition rather than from running the API survives both — which is how the getting-started page came to claim `(60, 40, 18)` for a bracket that measures `(60, 40, 12)`, `attach()` having recorded the boss rather than merged it.

`tests/test_example_claims.py` executes every example carrying such a comment and compares. Examples without one are left alone: the rule is to check claims, not to run everything. Write the comment only for a value you have actually seen — and when it disagrees with the code, run the example before deciding which is wrong, because that is how the wrong one got written.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-D-P6"
aliases = ["D-P6"]
layer = "mechanics"
section = "5. Documentation"
title = "File header tags."
statement = '''
Immediately after the licence header, every module carries:

```
  # LibFile: pybosl2/<name>.py          # required for public modules
  # FileSummary: <one line, < 120 chars>  # required for public modules
  # DocCategory: <section>              # required
  # FileGroup: BOSL2
```

`DocCategory` is one of `Foundational`, `Paths, regions & surfaces`, `Math & geometry`, `Parts library`, `Extras`, `Solid backends`, or `internal` (excluded from the public docs).
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-D-P6a"
aliases = ["D-P6a"]
layer = "mechanics"
section = "5. Documentation"
keyword = "MUST NOT"
statement = '''
A module that holds **any** publicly exported name MUST NOT be `internal` — that tag means "support code", and using it on a module users import silently drops a whole subsystem from the reference (SPEC S-47). The test: if the name appears in `pybosl2/__init__.pyi`, its module needs a public category, a `LibFile` and a `FileSummary`.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-D-P7"
