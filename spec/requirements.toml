Millimetres, degrees, right-handed Z-up (SPEC D-9). No API takes a `units=` parameter; a caller working in inches multiplies by `constants.INCH` at the call site. Do not introduce a second angular unit either — everything is degrees, and anything ported from a radians-based source converts on entry.
