[[requirement]]
id = "SPEC-G-1"
aliases = ["G-1"]
layer = "contract"
section = "8.1 Argument tiers"
title = "A parameter family that travels together is a group."
keyword = "MUST"
statement = '''
A parameter family that appears on more than three public callables and is always passed as a unit MUST be available as a frozen group object, so it can be built once and reused. `Placement(anchor, spin, orient)` is the case that motivated this: 50 callables take all three, another 31 take two of them, and every one of those restates the same defaults. `CapSpec` (S-24) is the pattern already in the library. A group is a *value*, not a namespace: it is frozen, it composes (`with_`), and it carries its own defaults. **A group reads in every dimension its members mean something in.** A placement is anchor, spin and orient in three dimensions and anchor and spin in two — there is no third axis in the plane to turn a face towards — so one placement serves a 2-D profile and the solid extruded from it, which is the case worth having.
'''
enforced_by = [
    "tests/test_groups.py::TestPlacementInThePlane::test_one_placement_serves_an_outline_and_the_solid_from_it",
]
status = "enforced"

[[requirement]]
id = "SPEC-G-6"
aliases = ["G-6"]
layer = "contract"
section = "8.1 Argument tiers"
title = "A group refuses what a dimension cannot honour."
keyword = "MUST"
statement = '''
Where a group means less in one dimension than another, the members that do not apply MUST be refused rather than dropped. A `Placement` carrying a real `orient` passed to a 2-D constructor raises, naming the way forward, because silently honouring two of its three members is the wrong answer E-5 forbids — the caller asked for an orientation and got a shape without one, with nothing said. The *default* `orient` is not a request: `Placement()` and `Placement(anchor=...)` are dimension-neutral and pass anywhere, which is what keeps one placement usable across a profile and its extrusion (G-1).
'''
enforced_by = [
    "tests/test_groups.py::TestPlacementInThePlane::test_a_placement_that_really_orients_is_refused",
]
status = "enforced"

[[requirement]]
id = "SPEC-G-7"
aliases = ["G-7"]
layer = "contract"
section = "8.1 Argument tiers"
title = "A group makes a conflict unrepresentable, not merely checked."
keyword = "SHOULD"
statement = '''
Where a family's members are mutually exclusive, the group SHOULD model the exclusion in its shape rather than validate it. `rounding` and `chamfer` are one edge treatment, not two independent sizes — an edge is rounded or chamfered, never both — and the library checked that in **six** places with six different wordings, not one of which said what to do instead. `EdgeTreatment` carries one kind and one size, so there is nothing left to disagree; the loose spellings keep the check (G-3), and it is now written once (G-5).
'''
enforced_by = [
    "tests/test_groups.py::TestEdgeTreatment::test_the_conflict_is_unrepresentable_in_the_group",
]
status = "enforced"

[[requirement]]
id = "SPEC-G-9"
aliases = ["G-9"]
layer = "contract"
section = "8.1 Argument tiers"
title = "Groups are resolved where the arguments already are."
keyword = "SHOULD"
statement = '''
A constructor taking several groups SHOULD resolve them in one call, operating on the arguments it is about to forward rather than beside them. The loose members are already listed in that dict, so resolving in place costs a constructor one wrapper; resolving beside it cost thirteen lines of unpacking in every constructor, which is the transcription B-3 exists to reduce rather than add to. `cube` and `cuboid` went from 53 lines to 28 on this change alone.
'''
enforced_by = []
candidates = []
status = "reviewed"
note = '''
Reviewed rather than enforced: no test can tell "resolved in one call" from "resolved in three" without asserting a shape of code, and the thing that actually goes wrong — a group not reaching the geometry — is covered by the per-group tests in tests/test_groups.py.
'''

[[requirement]]
id = "SPEC-G-8"
aliases = ["G-8"]
layer = "contract"
section = "8.1 Argument tiers"
title = "A parameter is a promise, and an unkept one refuses as a library error."
keyword = "MUST"
statement = '''
A parameter in a public signature says the library honours it. Where this port advertises one it does not build, the refusal MUST be a `Bosl2NotImplementedError` — a `Bosl2Error` so `except Bosl2Error` catches it (E-1), a `NotImplementedError` so existing callers are unaffected, and carrying a hint naming what to do meanwhile (E-2). Four public callables raised a bare `NotImplementedError` instead: `cyl(texture=...)`, `cuboid(teardrop=...)`, `CapType.CIRCLE` and `VNF.from_field` with a range. The gaps are listed and the list only shrinks. **`texture=` is the one that matters:** S-34 and S-35 specify textures as a working subsystem, the registry is built, and thirteen public constructors take the five texture parameters — so grouping those five (G-1) would be polish on a promise nothing keeps, which is why the `Texturing` group was not built.
'''
enforced_by = [
    "tests/test_unimplemented.py::test_every_gap_refuses_as_a_library_error",
]
status = "enforced"

[[requirement]]
id = "SPEC-G-2"
aliases = ["G-2"]
layer = "contract"
section = "8.1 Argument tiers"
title = "A group composes and inherits."
keyword = "SHOULD"
statement = '''
A group SHOULD offer `with_()` to derive a variant without mutating the original, and where the family has ambient defaults (§8.3) a way to read them. `None` in a member still means "not given, decide for me" (D-4), never "off".
