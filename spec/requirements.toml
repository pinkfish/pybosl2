[[requirement]]
id = "SPEC-A-6"
aliases = ["A-6"]
layer = "contract"
section = "4. Architecture"
keyword = "MUST"
statement = '''
Everything exported from the top level MUST honour the active backend. A constructor that only one backend can build belongs on that backend's module, not on `pybosl2`, so that `from pybosl2 import …` never silently produces a shape on the backend the caller did not select. Mixed neutral and backend-specific names at the top level is the defect this rule exists to prevent.
'''
enforced_by = [
    "tests/test_exports.py::test_no_top_level_name_builds_on_the_wrong_backend",
]
candidates = [
    "tests/test_backend_matrix.py::test_path_2d_geometry_builds_on_either_backend",
]
status = "enforced"
note = '''
The top-level export table was always checked; the geometry bridges were not, so Path2D.polygon() returned a CSG shape inside an sdf block whatever the caller had selected. Fixed in T29 by A-10 (build through the façade), and covered by the candidate test above as well as the export walk.
'''

[[requirement]]
id = "SPEC-A-7"
aliases = ["A-7"]
layer = "contract"
section = "4. Architecture"
keyword = "MUST"
statement = '''
A name in a module's `__all__` MUST resolve. An `__all__` entry with no matching attribute breaks `import *` and every tool that walks the export list.
'''
enforced_by = []
