statement = '''
The top-level `_LAZY_EXPORTS` points at the **façade** (`pybosl2.solid`, `pybosl2.flat`), never at a backend module, so no top-level name can build on a backend the caller did not select (SPEC A-6). A shape only one backend can make is reached through that backend's module, or gets a façade constructor that refuses on the other.
'''
