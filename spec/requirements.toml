[[requirement]]
id = "PLAN-L-1a"
aliases = ["L-1a"]
layer = "mechanics"
section = "1. Language baseline"
title = "Testing on one interpreter is not testing."
statement = '''
The differences between them are behavioural, not cosmetic, and this project has already been bitten twice by assuming otherwise:
* `isinstance` against a runtime-checkable Protocol uses `hasattr` on 3.11 and a static lookup from 3.12, which is why a computing property on a contract breaks *only* on the oldest supported version (T-6b and T-6e are the two halves — see T-6e).
* `typing.Protocol.__protocol_attrs__` does not exist before 3.12, so a test built on it passes on a new interpreter and errors on the supported floor.

Both were invisible to a full green run on a newer interpreter. So: before calling a change done, run the suite on **3.11** as well as on whatever you develop against — it is the version most likely to disagree with you, and CI runs it whether you did or not:

```bash
  python3.11 -m venv /tmp/venv311 && /tmp/venv311/bin/pip install -e '.[test]'
  /tmp/venv311/bin/python -m pytest -q
```

A construct that is version-specific by necessity is written to work on the floor, not on the newest — and never reaches for a `typing` internal, which is where both of these came from.
'''
enforced_by = []
candidates = [
    "tests/test_supported_versions.py::test_nothing_uses_a_typing_internal",
]
