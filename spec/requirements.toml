# The pybosl2 requirements registry -- the normative source for SPEC.md and PLAN.md.
#
# Generated once from the prose by scripts/extract_requirements.py (T26) and hand-maintained
# since. tests/test_requirements.py keeps it honest: ids are unique across both documents,
# every enforced_by target exists, every citation resolves, and the untriaged backlog only
# shrinks. Ids are permanent (SPEC 13 rule 5) -- a new requirement appends to its series, and
# a withdrawn one keeps its id.
#
# layer:   contract -> SPEC.md, mechanics -> PLAN.md
#
# status:  enforced   (the test in enforced_by fails when the rule is broken)
#          reviewed   (a human checks it at review time; no test can)
#          unenforced (nothing checks it, and the note says what is broken)
#          untriaged  (nobody has decided yet -- the backlog, which only shrinks)
#          withdrawn  (kept for its id, with the reason)
#
# candidates: tests that mention the id. Evidence for triage, never enforcement -- a test
#             that mentions a rule may guard it or may merely cite it, and only reading it
#             tells you which.

[[requirement]]
id = "SPEC-B2-1"
aliases = ["B2-1"]
layer = "contract"
section = "2. Relationship to BOSL2: feature parity, not API parity"
title = "Feature compatible."
statement = '''
Anything BOSL2 can build, pybosl2 aims to build — the same shapes, masks, roundings, sweeps, parts catalogue, and attachment model. Coverage of BOSL2's capabilities is the measure of completeness, and it is **published and checked**, not asserted: `docs/bosl2_coverage.rst` maps every upstream `.scad` file to the module that ports it with a status and a note, generated by `docs/_covgen.py` from a pinned upstream file list and kept honest by `tests/test_bosl2_coverage.py`. A claim of parity that nothing measures is a wish.
'''
enforced_by = [
    "tests/test_bosl2_coverage.py::test_every_named_module_exists",
]
candidates = [
    "tests/test_example_claims.py",
    "tests/test_partitions.py::test_mask_subpaths_keep_bosl2_amplitudes",
    "tests/test_parts_are_lazy.py",
    "tests/test_parts_backend_coverage.py::test_the_measured_coverage_matches_what_the_spec_claims",
]
status = "enforced"

[[requirement]]
id = "SPEC-B2-2"
aliases = ["B2-2"]
layer = "contract"
section = "2. Relationship to BOSL2: feature parity, not API parity"
title = "Not API compatible."
keyword = "MUST NOT"
statement = '''
pybosl2 MUST NOT copy OpenSCAD's calling conventions where Python has a better answer. A ported `.scad` module specifies *behaviour*, not signature:
* objects and methods replace module-with-children,
* chained methods replace transform wrappers,
* enums replace magic strings and numbers,
* exceptions replace `assert`/`echo` diagnostics,
* ambient context (`use_backend`, `use_defaults`) replaces `$`-special variables,
* keyword arguments with real defaults replace long positional lists.
'''
enforced_by = []
candidates = [
    "tests/test_mask_contract.py::test_no_public_masking_signature_mentions_a_native_type",
]
status = "untriaged"

[[requirement]]
id = "SPEC-B2-3"
aliases = ["B2-3"]
layer = "contract"
section = "2. Relationship to BOSL2: feature parity, not API parity"
title = "Names are kept where they help."
statement = '''
BOSL2's *names* (`cuboid`, `prismoid`, `path_sweep`, `rounding=`, `chamfer=`) are retained so the `.scad` source and the Python read side by side — except where Python forbids the name (`except` → `except_edges`) or a clearer spelling exists.
'''
enforced_by = []
candidates = [
    "tests/test_shape_contract.py::test_a_removed_synonym_does_not_come_back",
]
status = "untriaged"

[[requirement]]
id = "SPEC-B2-4"
aliases = ["B2-4"]
layer = "contract"
section = "2. Relationship to BOSL2: feature parity, not API parity"
title = "Departures are documented."
statement = '''
Where behaviour deliberately differs, the docstring says so.
'''
enforced_by = []
status = "untriaged"

