[[requirement]]
id = "SPEC-C-15"
aliases = ["C-15"]
layer = "contract"
section = "5.1 Shapes"
title = "One contract, two specialisations."
keyword = "MUST"
statement = '''
`Shape` declares everything true of every shape on every backend: the `backend` tag, the boolean operators, the transforms, `bounds()`, and `show()` (§6.16). `Flat` and `Solid` extend it and add **only** what is genuinely dimensional. A member that both would declare identically MUST live on `Shape` instead — that duplication is how `Flat` came to be missing `bounds()` (S-2) and to be typed `Any` long after `Solid` was not.
'''
enforced_by = []
candidates = [
    "tests/test_backend_matrix.py::test_one_shape_contract_with_two_specialisations",
    "tests/test_sdf_flat_parity.py",
]
status = "untriaged"

[[requirement]]
id = "SPEC-C-16"
aliases = ["C-16"]
layer = "contract"
section = "5.1 Shapes"
title = "Operations preserve the kind."
keyword = "MUST"
statement = '''
Every operation on a shape returns *the same kind of shape*, and an operand of a boolean MUST be the same kind: `flat | flat` and `solid | solid` are the only spellings, and `flat | solid` is a static error, not a runtime surprise. This is C-4 enforced by the contract rather than by convention.
'''
enforced_by = []
candidates = [
    "tests/test_error_contract.py::test_mixing_dimensions_raises_and_names_the_way_across",
]
status = "untriaged"

[[requirement]]
id = "SPEC-C-17"
aliases = ["C-17"]
layer = "contract"
section = "5.1 Shapes"
title = "Crossing dimensions is explicit and named."
statement = '''
`Flat` → `Solid` happens only through an extrusion or sweep; `Solid` → `Flat` only through `projection`. Each direction is a method a reader can see at the call site; neither happens implicitly.
'''
enforced_by = []
candidates = [
    "tests/test_backend_matrix.py::test_one_shape_contract_with_two_specialisations",
    "tests/test_sdf_flat_parity.py::test_minkowski_refuses_and_names_the_thing_that_does_work",
]
status = "untriaged"

[[requirement]]
id = "SPEC-C-18"
aliases = ["C-18"]
layer = "contract"
section = "5.1 Shapes"
title = "One declaration site, one name each."
statement = '''
All three protocols are declared together in the backend-contract layer (L1), so a change to the shared surface cannot land on one dimension and miss the other. `Shape`, `Flat` and `Solid` are the only names for them — no aliases: a second spelling of a contract is a second thing to keep in step, and `Shape2D` was exactly that.
'''
enforced_by = []
candidates = [
    "tests/test_backend_matrix.py::test_one_shape_contract_with_two_specialisations",
]
status = "untriaged"

[[requirement]]
id = "SPEC-C-19"
aliases = ["C-19"]
layer = "contract"
section = "5.1 Shapes"
title = "Colour and distribution belong to the shared contract."
keyword = "SHOULD"
statement = '''
Both are operations on "any shape", not on solids specifically, so they SHOULD be members of `Shape` (S-37, S-31). They are universal now: the SDF backend's solids carry colour as field metadata, and its 2-D shapes gained the same shared mixins the solids had (`Colorable`, `Anchorable`, `Distributable`). The gap was never a limit of distance fields — colour is metadata, distribution is matrices, and anchoring needs only a bounding box, which an SDF carries exactly. It was the 2-D shape having inherited none of it.
'''
enforced_by = []
candidates = [
    "tests/test_backend_parity.py::test_colour_and_modifiers_are_recorded_on_the_field",
    "tests/test_regions.py::test_geometry_preserves_color",
    "tests/test_sdf_flat_parity.py::test_colour_does_not_leak_between_copies",
    "tests/test_sdf_flat_parity.py::test_the_sdf_flat_shape_satisfies_the_contract",
    "tests/test_shape_contract.py",
]
status = "untriaged"

[[requirement]]
id = "SPEC-C-20"
aliases = ["C-20"]
layer = "contract"
section = "5.1 Shapes"
title = "The contract is the whole object, and it is measured."
keyword = "MUST"
statement = '''
Every public operation a shape implements MUST be declared on `Shape`, `Flat` or `Solid`. A protocol that declares a third of what the object does is not a contract — it is a subset that silently locks typed callers out of the rest, and a caller who follows this library's own typing advice (PLAN §2) is exactly who it locks out. `def with_boss(base: Solid) -> Solid: return base.attach(...)` MUST type-check; attachment, tagging, distribution, the edge treatments, the half-cuts and the colour methods are the library's headline composition features and none of them may be reachable only by accident of the concrete class. Conformance is **checked, not asserted**: a contract test walks the public attributes of every implementation and fails on any name the protocols do not declare, with a named, justified allowlist for the deliberate exceptions. Drift between the declared surface and the delivered one is the defect this rule exists to prevent — it is how `Flat` came to be missing `bounds()` (S-2), and it recurred at scale immediately after C-15 closed.
'''
enforced_by = [
    "tests/test_shape_contract.py::test_the_contract_is_the_whole_object",
]
candidates = [
    "tests/test_sdf_flat_parity.py::test_the_sdf_flat_shape_satisfies_the_contract",
]
status = "enforced"

[[requirement]]
id = "SPEC-C-21"
aliases = ["C-21"]
layer = "contract"
section = "5.1 Shapes"
title = "One operation, one name."
statement = '''
A shape operation has exactly one public spelling. Synonym pairs — `move`/`translate`, `rot`/`rotate`, `fwd`/`forward`, `bounding_box`/`bounds`, `nominal_size`/`size` — double the surface a reader has to learn and halve the chance two call sites are written the same way, and each one is a second thing to keep in step. Where BOSL2's name and Python's differ, keep BOSL2's (B2-3) and drop the other. This is deliberately narrower than D-5: two spellings of a *dimension* (`radius`/`diameter`) are a convenience the caller chooses between, whereas two spellings of an *operation* are the same call twice.
'''
enforced_by = [
    "tests/test_shape_contract.py::test_no_public_class_carries_both_spellings_of_one_operation",
]
candidates = [
    "tests/test_backend_parity.py::test_every_directional_move_stays_in_the_field",
    "tests/test_bounds_contract.py::test_a_shape_has_one_public_name_for_its_nominal_box",
    "tests/test_shape_contract.py::test_a_removed_synonym_does_not_come_back",
    "tests/test_shapes3d.py::test_rotate_has_one_spelling",
]
status = "enforced"
note = '''
Closed on the shape surface in T17 and open everywhere the test did not look: Path2D and Path3D each carried three synonym pairs until T32 — deduplicate/deduplicated, subdivide/subdivide_path, resample/resample_path. The check now walks every public class reachable from the top level, not one class family.
'''

[[requirement]]
id = "SPEC-C-22"
aliases = ["C-22"]
layer = "contract"
section = "5.1 Shapes"
title = "The dimensional split is earned, not historical."
keyword = "MUST"
statement = '''
A member present on one of `Flat`/ `Solid` and absent from the other MUST be genuinely dimensional (C-15). `xflip`/`yflip` on `Flat` alone, `spin` on `Flat` alone, `up`/`down` on `Solid` alone are the shape of the defect: nothing about two dimensions forbids the first two, and nothing about three requires a separate name for the third. A member that both dimensions can honour belongs on `Shape`.
'''
enforced_by = []
candidates = [
    "tests/test_sdf_flat_parity.py::test_distribute_on_path_unions_the_copies_into_one_shape",
    "tests/test_shape_contract.py::test_the_contract_is_the_whole_object",
]
status = "untriaged"

[[requirement]]
id = "SPEC-C-23"
aliases = ["C-23"]
layer = "contract"
section = "5.1 Shapes"
title = "A contract member is typed, or it is on a shrinking list."
keyword = "MUST"
statement = '''
C-20 requires the contract to cover the whole object; this requires the cover to mean something. A member declared `(*args: Any, **kwargs: Any)` is present by name and checked not at all — the method is found and every argument is accepted, including the wrong ones, which is worse than a missing member because it reads as a promise. Where the two backends' concrete signatures genuinely differ in a way no checker can reconcile, the protocol MAY declare the caller's view with `Any` (PLAN T-6c); that is a bounded list that only shrinks, not a default. What is *not* that case, and MUST be written out rather than listed, is a member whose implementations already agree — which was 23 of the first 48, the whole distribution and attachment families. Note what does **not** justify a loose declaration: an implementation that is itself loose. A CSG-only feature refused on the SDF backend by a `(*_args: Any, **_kwargs: Any)` stub (PAR-3) satisfies *any* protocol signature, so the contract is free to declare the real one; the loose stub is a fact about the refusal, not a constraint on the contract. Reading it as a constraint is what left the attachment family unchecked.
'''
enforced_by = [
    "tests/test_contract_typing.py::test_no_new_loosely_typed_member",
]
status = "enforced"

[[requirement]]
id = "SPEC-C-1"
aliases = ["C-1"]
layer = "contract"
section = "5.1 Shapes"
statement = '''
Every shape carries a `backend` tag naming the backend that **produced** it. It is a property of the object, never a reading of the ambient backend at construction time — a CSG shape built inside a `use_backend("sdf")` block is still a CSG shape, and must say so. Booleans and transforms return a shape on the same backend; mixing raises `CrossBackendError` naming the conversion that fixes it. A tag that reports the ambient backend defeats that guard entirely and turns a clear error into an internal one.
'''
enforced_by = []
candidates = [
    "tests/test_backend_matrix.py::test_2d_shape_constructors_refuse_on_another_backend",
    "tests/test_backend_matrix.py::test_a_csg_shape_built_inside_an_sdf_block_still_says_csg",
    "tests/test_backend_parity.py::test_every_directional_move_stays_in_the_field",
    "tests/test_backend_parity.py::test_sdf_shapes_keep_their_backend_through_moves_and_colour",
]
status = "untriaged"

[[requirement]]
id = "SPEC-C-2"
aliases = ["C-2"]
layer = "contract"
section = "5.1 Shapes"
statement = '''
Operators are the primary spelling: `|` union, `&` intersection, `-` difference.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "SPEC-C-3"
aliases = ["C-3"]
layer = "contract"
section = "5.1 Shapes"
statement = '''
Shapes are immutable by convention: every operation returns a new shape, so calls chain. `attach()` and `tag()` copy rather than mutate; the `attachments` / `tag_name` setters exist for those copies to use and are not part of the public contract.
'''
