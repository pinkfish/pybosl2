statement = '''
Any path MUST be strokeable: `stroke(width, closed, endcaps, endcap1, endcap2, joints)` yields a filled outline in 2-D and a solid tube in 3-D, and `dashed_stroke` yields the dashed form. Both are also part of the backend contract, so a stroke works on either backend.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "SPEC-S-23a"
aliases = ["S-23a"]
layer = "contract"
section = "6.7 Strokes and end caps"
title = "One family, one kind of answer."
statement = '''
A stroke is the **area the pen covers**, so in 2-D it is a `Region` — outlines-with-holes, which is what a dashed stroke needs and what a stroked region already returned — and in 3-D a `Solid`. `Path2D.stroke()` returning a `Path2D` described the *boundary* rather than the mark, and left one member of a four-member family answering a different kind of thing from the other three (`Path2D.dashed_stroke`, `Region.stroke`, `Region.dashed_stroke` all return `Region`; `Path3D.stroke` returns `Solid`). The underlying outline stays reachable through the region's `paths`.
'''
enforced_by = []
candidates = [
    "tests/test_backend_matrix.py::test_stroke_of_a_2d_path_is_a_backend_free_outline",
    "tests/test_drawing.py::test_stroke_2d_builds",
