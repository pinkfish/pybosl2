status = "untriaged"

[[requirement]]
id = "SPEC-A-8"
aliases = ["A-8"]
layer = "contract"
section = "4. Architecture"
title = "A family is exported whole."
keyword = "MUST"
statement = '''
Where the top level exports part of a named family, it exports all of it: five `mask2d_*` without `mask2d_roundover`, or the sweep enums without `SweepMethod`, is drift rather than a decision, and it costs the caller an import hunt at exactly the moment the design was meant to be paying off. The families that MUST be reachable from `pybosl2` are the ones the spec names as the way to do something: the sweeps (S-19), their enums and the `os_*` end treatments (S-20, S-21), the masks (S-26), the turtles (S-10), `Quaternion` (S-5), and the corner-treatment entry points (S-8). Checked by a test, not by review.
'''
enforced_by = []
candidates = [
    "tests/test_exports.py::test_polyline_ratchet_would_catch_a_raw_nesting",
    "tests/test_exports.py::test_the_named_families_are_exported_whole",
]
status = "untriaged"

