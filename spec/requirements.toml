[[requirement]]
id = "SPEC-S-26a"
aliases = ["S-26a"]
layer = "contract"
section = "6.8 Masks, profiles and edge treatments"
title = "A mask does not ask for what its parent knows."
keyword = "MUST"
statement = '''
A 3-D mask cuts a solid, and the solid already knows its own box, so `size=` MUST be optional and derived from the parent when the mask is applied through `edge_mask`/`edge_profile`/`corner_profile`/`face_profile` (P-3, D-6). `mask3d_roundover(r, size)` demanding two positional arguments — one of which is the parent's dimensions — is P-1 inverted on the treatment users reach for most.
'''
