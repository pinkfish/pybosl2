[[requirement]]
id = "SPEC-C-7"
aliases = ["C-7"]
layer = "contract"
section = "5.2 Geometry objects"
keyword = "MUST"
statement = '''
`Path` is abstract; `Path2D`/`Path3D` are selected by point dimension. Any API taking a polyline MUST accept a `Path` — and MUST say so in its signature, not merely tolerate one at runtime: a caller feeding one function's result to the next is the normal way to use the library, and it must type-check ([PLAN T-4](PLAN.md#2-typing)).
'''
enforced_by = []
candidates = [
    "tests/test_exports.py::test_every_polyline_parameter_accepts_a_path",
