title = "— Objects, not argument bags."
keyword = "MUST"
statement = '''
The library is object-oriented by preference: parts, paths, regions, meshes, colours and quaternions are **classes** that own their operations and expose derived values as properties. A family of free functions sharing a prefix and a pile of parameters MUST instead be a class. The *design* is Python's, not a transliteration of `.scad`.
'''
