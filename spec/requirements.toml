    "tests/test_validation_messages.py",
]
status = "untriaged"

[[requirement]]
id = "PLAN-E-P2"
aliases = ["E-P2"]
layer = "mechanics"
section = "7. Errors"
statement = '''
`assert` is for internal invariants only. An `assert` that a user's argument combination is valid is a defect: asserts vanish under `python -O`, and `AssertionError` tells the caller nothing about what to pass. The test for which is which: **if the message names a parameter the caller typed, it is validation and must raise `ValueError`**; if it states something the code guarantees for itself ("cells are non-empty here"), it is an invariant and may stay an assert with no user-facing wording. Two corollaries, each with its own ratchet in `tests/test_defaults.py`:
* A **message-less** `assert` on a parameter is validation too — it is the worst form, since `python -O` erases it and the caller gets wrong geometry instead of an error. It is allowed only where it *narrows* a value the function already validated, which shows as an earlier `raise` whose message names that parameter.
* **`raise AssertionError(...)` is never right.** It survives `-O`, so it is not even an assert's equivalent, and it reports the caller's mistake as an internal bug. Bad input raises `ValueError`; a broken invariant uses `assert`.
'''
enforced_by = []
candidates = [
    "tests/test_defaults.py::test_no_assert_validates_user_input",
    "tests/test_defaults.py::test_no_bare_assert_stands_in_for_validation",
]
status = "untriaged"

[[requirement]]
id = "PLAN-E-P3"
aliases = ["E-P3"]
layer = "mechanics"
section = "7. Errors"
keyword = "MUST"
statement = '''
Library errors derive from `pybosl2.exceptions.Bosl2Error`; backend refusals use `UnsupportedByBackendError(feature, backend, hint=…)` and cross-backend mixing uses `CrossBackendError`. Both MUST carry an actionable hint.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-E-P4"
aliases = ["E-P4"]
layer = "mechanics"
section = "7. Errors"
statement = '''
Never swallow an exception to return a degenerate shape. A constructor that cannot produce a usable shape from what it was given raises (SPEC E-5); it does not return a polygon of coincident points, a zero-size solid, or anything whose `bounds()` is infinite or `NaN`. `tests/test_min_args.py` asserts the *result*, not merely the absence of a traceback: a zero-argument call either raises `ValueError` or produces a shape with finite, positive bounds.
'''
enforced_by = []
candidates = [
    "tests/test_defaults.py::test_argument_free_constructors_either_build_or_explain",
]
status = "untriaged"

[[requirement]]
id = "PLAN-E-P4a"
aliases = ["E-P4a"]
layer = "mechanics"
section = "7. Errors"
title = "Validation errors are `Bosl2ValueError`."
statement = '''
SPEC E-1 and E-4 both bind, so the type raised for bad input derives from **both** `Bosl2Error` and `ValueError`:

```python
  class Bosl2ValueError(Bosl2Error, ValueError):
      """Bad input: a ValueError for callers who expect one, a Bosl2Error for callers who catch the family."""
```

Every `raise ValueError(...)` in the package becomes `raise Bosl2ValueError(...)`; the message is unchanged, `except ValueError` keeps working unmodified, and `except Bosl2Error` starts working. Tests that assert `pytest.raises(ValueError)` need no change — that is the point of the MRO. New code raises `Bosl2ValueError`; a bare `ValueError` in the package is a defect, guarded by the same AST ratchet that keeps the `assert`s out (`tests/test_errors.py`).
'''
enforced_by = []
candidates = [
    "tests/test_error_contract.py::test_the_package_raises_no_bare_value_error",
]
status = "untriaged"

[[requirement]]
id = "PLAN-E-P4b"
aliases = ["E-P4b"]
layer = "mechanics"
section = "7. Errors"
title = "An error raised from `__getattr__` is an `AttributeError` too."
statement = '''
SPEC E-6. `UnsupportedByBackendError` inherits `AttributeError` alongside `Bosl2Error`, because Python's attribute protocol is defined in terms of that type: `hasattr()` and `getattr(x, n, default)` catch `AttributeError` and nothing else, so any other type turns a capability probe into a traceback and breaks `copy`, `pickle`, `inspect` and every REPL completion. Refusals raised from a *call* are unaffected by the change — the extra base is invisible unless something is probing.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-E-P5"
aliases = ["E-P5"]
layer = "mechanics"
section = "7. Errors"
statement = '''
Resolve radius/diameter spellings through `_helpers.pick_radius()`, never with a hand-rolled `radius if radius is not None else diameter / 2` ternary. The helper is what enforces SPEC D-5 — same-dimension conflicts raise, specificity levels resolve most-specific-first — and a local ternary silently opts out of it.
'''
enforced_by = []
status = "untriaged"

[[requirement]]
id = "PLAN-E-P6"
aliases = ["E-P6"]
layer = "mechanics"
section = "7. Errors"
keyword = "MUST NOT"
statement = '''
An attribute fallback (`__getattr__`) MUST NOT convert a shape to another representation to satisfy a missing method. Implement the method or raise `UnsupportedByBackendError`; meshing a distance field to answer `.up(5)` is a silent, lossy backend conversion (SPEC B-5, C-1).
'''
enforced_by = []
candidates = [
    "tests/test_backend_parity.py::test_sdf_shapes_keep_their_backend_through_moves_and_colour",
]
status = "untriaged"

