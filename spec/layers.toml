# The layer model, as data (SPEC A-1).
#
# SPEC 4 states "a lower layer MUST NOT import a higher one" and, until T29, nothing measured it.
# Two things came out of measuring it. The rule held far less often than the prose implied, and
# the table in SPEC 4 could not have described the code even in principle: it put `exceptions`,
# `enums` and `_edges_lang` in a layer *above* pure geometry, when every geometry module raises
# `Bosl2ValueError` and takes an `Anchor`, and it left six modules out altogether.
#
# So the layers below are a corrected model, chosen by measurement: the foundations that
# everything may use sit at the bottom, the backend contract above them (it is FFI-free and the
# geometry types are declared against it), pure geometry above that, the backend implementations
# above that, the façade above those, and the parts library on top.
#
# An edge from a lower layer to a higher one is classified three ways:
#
#   * runtime, module level -- the violation. Listed in `known_violations` while it exists; the
#     list only shrinks.
#   * type-checking only    -- allowed and unlisted. `if TYPE_CHECKING:` creates no runtime
#                              dependency and PLAN M-4 requires annotations to use it.
#   * deferred (in a body)  -- allowed only when listed in `allowed_deferred` with a reason,
#                              which is PLAN M-5's "genuine cycle, and commented" made checkable.

[layers]
# Bottom to top. A module may import anything at its own level or below.
L0_foundations = [
    "exceptions", "enums", "constants", "math", "version", "_mctable",
    "points", "vectors", "_edges_lang", "defaults", "groups",
]
L1_contract = ["_backend"]
L2_geometry = [
    "geometry", "paths", "path2d", "path3d", "regions", "beziers", "nurbs", "quaternions",
    "vnf", "rounding", "skin", "textures", "bounds", "color", "transforms", "svg", "turtle",
    "_helpers", "_anchoring", "distributors", "export", "caps",
]
L3_backends = [
    "shapes2d", "shapes3d", "sdf", "masking", "partitions", "surfaces3d", "isosurface",
    "miscellaneous", "_shape", "_csg", "_native", "_stroke2d", "_stroke3d",
]
L4_facade = ["solid", "flat"]
L5_parts = ["parts"]

# Deferred edges that are architecture rather than debt: PLAN M-5 reserves the function-local
# import for a genuine cycle, so an entry here is only legitimate if the target imports the source
# back. That is checked, not taken on trust -- tests/test_layering.py resolves the cycle itself and
# rejects an entry whose claim does not hold. Six deferred edges failed that check when the list
# was first drawn up and went to known_violations instead, where they belong: deferring an import
# to dodge a layer is not the same as deferring one to break a cycle.
[allowed_deferred]
"_backend -> _csg" = "Registry inversion: the contract module bootstraps the backends that register against it."
"_backend -> sdf" = "Registry inversion, as above."
"_helpers -> shapes2d" = "shapes2d imports the helpers it is built from."
"_helpers -> shapes3d" = "shapes3d imports the helpers it is built from."
"caps -> _stroke3d" = "The 3-D stroke builds its caps from this module."
"path2d -> shapes3d" = "shapes3d takes Path2D for its extrusions."
"path2d -> _stroke2d" = "The 2-D stroke takes the path it strokes."
"regions -> _stroke2d" = "The 2-D stroke takes the region it strokes."
"vnf -> isosurface" = "isosurface returns the mesh type."

# The A-10 bridge: a geometry type reaching the façade to build a shape. It is an upward edge by
# construction -- the façade sits above geometry -- so it cannot be justified as a cycle and is not
# debt either. It is the door SPEC A-10 says to use. Checked by its target being a façade module,
# so nothing else can be smuggled in under this heading.
[facade_bridges]
"path2d -> flat" = "Path2D.polygon() builds through the façade (A-10)."
"regions -> flat" = "Region.geometry() builds through the façade (A-10)."
"masking -> solid" = "A mask cutter is built by whichever backend is active, so `masking` takes `cuboid` from the façade rather than from a backend module. It sat in known_violations until T56 measured it: the section's own check -- is the target a façade module? -- passes, and reaching *down* to the neutral façade is the thing A-10 asks for, not a layer being dodged."

# Runtime module-level edges, plus the deferred ones that are not cycles. Every one is debt and
# the list only shrinks. `A-10` marks the geometry bridge -- a geometry type reaching a backend
# module directly instead of the façade.
#
# Three more went in T56, and they had been counted *twice*: `_helpers -> shapes2d`,
# `_helpers -> shapes3d` and `vnf -> isosurface` were listed here **and** in `allowed_deferred`,
# and all three are genuine cycles. Their rows here claimed a module-level edge ("at module level",
# "Module level as well as deferred") that no longer exists -- removed at some point, with the row
# left behind. Nothing checked for an edge appearing in two sections until T56 added it; T55 had
# added that check for `capability_edges` alone, which was too narrow the day it was written.
#
# Four entries were removed in T50 that had never belonged: `color -> _shape`,
# `distributors -> _shape`, `path3d -> shapes3d` and `turtle3d -> shapes3d` exist **only** under
# `if TYPE_CHECKING`, which the model above calls "allowed and unlisted". They made the debt look
# a quarter worse than it was, and the staleness check could not see it -- it asked whether the
# edge existed, not whether it was the *kind* of edge this list is for.
[known_violations]
"_helpers -> _native" = "`as_native_2d` coerces a bare point list into a native polygon, which means calling `native(\"polygon\")`. That is CSG machinery in a geometry module -- the same shape as `Extrudable`, one layer down -- and the fix is the same size: the coercion would have to build through the façade, which returns a wrapper rather than the raw handle its callers want."
"beziers -> shapes3d" = "`debug_bezier_patches` marks control points with native spheres and wraps them in `Bosl2Solid` so a union works either way round. It is a *debug helper* that builds CSG directly -- the same defect `Region.debug_region` had until T53, and it should get the same treatment: refuse under its own name on another backend, rather than letting the wrapper fail from inside."
"path3d -> _stroke3d" = "`Path3D.stroke` calls the 3-D stroke, which lives in a backend module. Its 2-D twin `path2d -> _stroke2d` is a legitimate cycle because `_stroke2d` takes a `Path2D`; this one is not, because `_stroke3d` takes a `PathLike`. T56 typed its three `path: Any` parameters (a C-20 defect on its own) and confirmed `PathLike` is the honest type -- narrowing to `Path3D` would have manufactured the cycle rather than found one."
"skin -> sdf" = "`spiral_sweep` dispatches to the SDF backend's own exact form when that backend is active, because a helical sweep has a closed-form distance field and meshing one would be B-5's lossy conversion. It cannot go through the façade: `pybosl2.solid` carries no `spiral_sweep`. This is the `masking -> solid` case without a façade equivalent to reach."

# Upward edges that buy a capability the layer below cannot have. Unlike `known_violations` these
# are not going away, and saying so is more useful than a list that never shrinks: a reader of the
# debt list should be looking at things somebody could act on.
#
# What stops this becoming a dumping ground is `pinned_by`. Every entry names a test that holds the
# capability in place -- so the claim "this edge buys something" is checked rather than asserted,
# and anyone who thinks the edge is removable finds out what it costs before they try. That test
# must exist and must mention the edge's source; `tests/test_layering.py` verifies both.
#
# Three tasks of measurement produced these. Each had a *different* stated reason in
# `known_violations` first, and all three were wrong -- see SPEC 12.2 items 22 and the T50/T52/T53/T54
# entries in TASKS.md.
[capability_edges]

[capability_edges."path2d -> miscellaneous"]
reason = "`Extrudable` composes *native* primitives, so it is backend machinery, and `Path2D` inherits it. Its two sibling mixins are at L2 because they build a neutral `VNF` and call `.polyhedron()`; this one cannot, because a VNF sweep needs the cross-section as points and these methods exist precisely to take a profile that is not one -- a disjoint multi-part shape, or rendered text. Rewriting them to build a VNF removes that."
pinned_by = "tests/test_neutral_geometry_is_not_gated.py::test_the_path_extrusions_take_a_profile_a_sweep_cannot"

[capability_edges."path3d -> miscellaneous"]
reason = "`Extrudable` on `Path3D`, as above."
pinned_by = "tests/test_neutral_geometry_is_not_gated.py::test_the_path_extrusions_take_a_profile_a_sweep_cannot"

[capability_edges."regions -> shapes3d"]
reason = "`Region.debug_region(vertices=True)` numbers each vertex with `text3d`, which renders a font and is CSG-only. It cannot go through the façade: `pybosl2.solid` is by design the primitives *both* backends expose. Deferred, so importing `pybosl2.regions` does not pull a backend module in, and the labels refuse under their own name."
pinned_by = "tests/test_neutral_geometry_is_not_gated.py::test_the_vertex_labels_refuse_under_a_name_the_caller_can_act_on"
