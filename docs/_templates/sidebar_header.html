<div class="sidebar-sticky">
  <div class="sidebar-brand">
    <a class="sidebar-logo" href="{{ pathto('index') }}">pybosl2</a>
    <div class="sidebar-version" id="sidebar-version" style="font-size:0.75em;opacity:0.7;margin-top:2px;">
      {{ release }}
    </div>
    <div class="sidebar-icons">
      <a href="{{ pathto('genindex') }}" title="API Index" class="sidebar-icon-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
      </a>
      <a href="specs/index.html" title="Spec Sheets" class="sidebar-icon-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </a>
    </div>
  </div>
  <div class="sidebar-version-banner" id="version-banner" style="display:none;padding:6px 12px;margin:8px 0;border-radius:6px;font-size:0.78em;background:rgba(56,189,240,0.12);border:1px solid rgba(56,189,240,0.3);">
  </div>
</div>

<script>
(function(){
  var banner = document.getElementById('version-banner');
  var path = window.location.pathname;
  if (/\/dev\//.test(path)) {
    banner.style.display = 'block';
    banner.innerHTML = '&#9888;&#65039; <b>Dev docs</b> &mdash; may be unstable. <a href="../index.html">Go to stable release</a>';
  } else if (/\/v\d+\.\d+\.\d+\//.test(path)) {
    var m = path.match(/\/v(\d+\.\d+\.\d+)\//);
    banner.style.display = 'block';
    banner.innerHTML = '&#128230; <b>' + m[1] + '</b> &mdash; <a href="../index.html">View latest release</a>';
  }
})();
</script>
