[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybosl2"
# Read from pybosl2/version.py's __version__ (the in-code default version), so the
# packaged version and the code never drift; the release workflow updates it there.
dynamic = ["version"]
description = "Python ports of the BOSL2 OpenSCAD library for use with PythonSCAD"
readme = "README.md"
license = "BSD-2-Clause"
requires-python = ">=3.11"
authors = [
    { name = "pinkfish" },
]
keywords = ["3d", "openscad", "pythonscad", "pybosl2", "cad", "3d-printing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy",
    "typing-extensions",
    "webcolors>=25",
    "svgelements>=1.9",
    "shapely>=2",
]

[project.optional-dependencies]
# Everything needed to run the test-suite in a venv. `pythonscad` provides the
# real `pythonscad`/`openscad` native modules the geometry code imports; the STL
# render tests additionally need the PythonSCAD app binary and skip without it.
#
# `mypy` is a genuine test dependency, not just a lint tool: SPEC Q-6 makes every
# docstring example type-check, and tests/test_docstring_examples.py runs it. It
# belongs here rather than in each workflow so no job -- present or future -- can
# install the suite and silently skip that gate.
test = [
    "pytest>=7",
    "numpy",
    "pythonscad",
    "typing-extensions",
    "shapely",
    "mypy>=1.8",
]
# Retained for backward compatibility; shapely is now a required dependency.
geo = []
# Build the API docs (Sphinx autodoc). Needs pythonscad because the geometry
# modules import it at load time, before autodoc can read their docstrings.
docs = [
    "sphinx>=7,<9",
    "shapely",
    "sphinx-immaterial>=0.13",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/pinkfish/pybosl2"
Repository = "https://github.com/pinkfish/pybosl2"

[tool.setuptools.dynamic]
version = { attr = "pybosl2.version.__version__" }

[tool.setuptools.packages.find]
# pybosl2 is the BOSL2 port
include = ["pybosl2", "pybosl2.*"]

# PEP 561: without py.typed in the wheel, every type checker downstream ignores this package --
# `mypy --strict`, the .pyi stubs and the type-checked examples (SPEC Q-6) all stop at the
# distribution boundary. setuptools ships the stubs unasked but not the marker (SPEC Q-7).
[tool.setuptools.package-data]
pybosl2 = ["py.typed", "*.pyi", "**/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The render tests write meshes into tmp_path; keeping every passing test's scratch filled the
# system volume (and, when TMPDIR was unwritable, dropped a pytest-of-* tree in the repo root).
# Keep scratch only for failures, and only the last run's.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
# Target Python version
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["N", "E", "F", "I", "B", "SIM", "RUF100", "A", "C4", "CPY", "PIE", "PYI", "SLOT", "TID", "TC", "ARG", "NPY", "PD", "PT", "D"]
ignore = ["D203", "D213", "D402"]

[tool.ruff.lint.per-file-ignores]
"docs/**" = ["PT", "D"]
"tests/**" = ["D"]
"pysolidfive/**" = ["PT", "D"]
"pybosl2/sdf/**" = ["D"]

[tool.ruff.format]
# Use double quotes for strings
quote-style = "double"

[tool.mypy]
strict = true
ignore_missing_imports = true
# docs/ has no __init__.py, and its scripts are reachable both as top-level modules (conf.py puts
# docs/ and docs/_ext/ on sys.path) and as `docs._specgen` / `docs._ext.stl_viewer` (the scripts put
# the repo root on sys.path). Without this, `mypy .` stops at "Source file found twice under
# different module names" before checking anything.
explicit_package_bases = true
exclude = [
    '^build/',
    '^\.venv/',
    '^node_modules/',
]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "docs.*",
]
ignore_errors = true

[tool.coverage.run]
source = ["pybosl2"]
parallel = false

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "def __repr__",
    "def __str__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.xml]
output = "coverage.xml"
